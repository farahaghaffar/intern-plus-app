<title>Intern+ Pilot App</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: Intern+ website shell (dark, lime accent); app chrome on dark surfaces, the student report and employer shortlist on white "paper" panels like the site's demo panel. Single dark brand look. */
:root{
  color-scheme:dark;
  --bg:#0A0F0D; --surface:#141B17; --surface-2:#1B2420;
  --ink:#F4F7F5; --ink-soft:#9FB2AA; --ink-faint:#768A81;
  --line:rgba(244,247,245,0.10); --line-strong:rgba(244,247,245,0.20);
  --accent:#D7F24E; --accent-ink:#0A0F0D; --accent-dim:#2B3420;
  --card:#FFFFFF; --card-ink:#10151A; --card-sub:#5E6D66; --card-line:#E4E8E5; --card-soft:#F5F8F6;
  --grad1:#0B4332; --grad2:#0E7F5F;
  --amber:#E8A33D; --good:#5BD18B; --bad:#F07A6A;
  --f-display:'Bebas Neue','Arial Narrow',sans-serif;
  --f-body:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html{overflow-x:clip}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px;overflow-x:clip}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
button,input,select,textarea{font-family:inherit;font-size:inherit}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.wrap{max-width:1080px;margin-inline:auto}

/* NAV */
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;padding-block:14px}
.navcard{max-width:1080px;margin-inline:auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  background:rgba(20,27,23,0.85);backdrop-filter:blur(14px) saturate(140%);border:1px solid var(--line);border-radius:16px;padding:10px 14px}
.brand{display:flex;align-items:center;gap:10px}
.brandmark{width:34px;height:34px;border-radius:9px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--accent-ink)}
.brandword{font-weight:700;font-size:1.05rem;letter-spacing:-0.01em}
.pilottag{font-family:var(--f-mono);font-size:0.66rem;letter-spacing:0.06em;text-transform:uppercase;color:var(--accent);background:var(--accent-dim);padding:3px 8px;border-radius:6px;font-weight:600}
.tabswitch{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.tabbtn{border:none;background:transparent;color:var(--ink-soft);font-weight:700;font-size:0.85rem;padding:8px 16px;border-radius:999px;cursor:pointer}
.tabbtn.on{background:var(--accent);color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* COMMON */
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:0.8rem;font-weight:600;color:var(--ink-soft)}
.eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent)}
.pagehead{padding-block:28px 18px;display:flex;flex-direction:column;gap:10px}
.pagehead h1{font-family:var(--f-display);font-weight:400;text-transform:uppercase;font-size:clamp(2.4rem,7vw,4rem);line-height:0.92;letter-spacing:0.005em}
.pagehead h1 .hl{color:var(--accent)}
.pagehead .lead{color:var(--ink-soft);max-width:60ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}
.paper{background:var(--card);color:var(--card-ink);border-radius:18px;padding:22px;box-shadow:0 30px 60px -30px rgba(0,0,0,0.6)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:720px){.grid2,.grid3{grid-template-columns:1fr}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:10px;font-weight:700;font-size:0.88rem;cursor:pointer;border:1px solid transparent;white-space:nowrap}
.btn-accent{background:var(--accent);color:var(--accent-ink)}
.btn-outline{background:transparent;color:var(--ink);border-color:var(--line-strong)}
.btn-dark{background:var(--card-ink);color:#fff}
.btn-ghost{background:transparent;color:var(--ink-soft);border:none;padding:8px 10px}
.btn[disabled]{opacity:0.45;cursor:not-allowed}
.paper .btn-outline{color:var(--card-ink);border-color:var(--card-line)}
.small{font-size:0.82rem}
.muted{color:var(--ink-soft)}
.faint{color:var(--ink-faint)}
.notice{border:1px dashed var(--line-strong);border-radius:14px;padding:16px 18px;color:var(--ink-soft);font-size:0.9rem}
.notice strong{color:var(--ink)}
.sample{font-family:var(--f-mono);font-size:0.62rem;letter-spacing:0.05em;text-transform:uppercase;color:#7A6300;background:#FBF3C8;padding:2px 7px;border-radius:5px;font-weight:600;vertical-align:middle}

/* FORMS */
label.f{display:flex;flex-direction:column;gap:6px;font-size:0.82rem;font-weight:600;color:var(--ink-soft);min-width:0}
.f input,.f select,.f textarea{width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--line-strong);background:var(--bg);color:var(--ink);font-weight:500}
.f textarea{min-height:70px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:7px 13px;border-radius:999px;background:var(--surface-2);color:var(--ink-soft);font-size:0.82rem;font-weight:600;cursor:pointer;border:1px solid var(--line);user-select:none}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip.must{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.must::after{content:" · must";font-weight:700}
.check{display:flex;gap:10px;align-items:flex-start;font-size:0.86rem;color:var(--ink-soft)}
.check input{margin-top:3px;accent-color:var(--accent)}
.err{color:var(--bad);font-size:0.84rem}

/* STEPPER */
.stepper{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.stp{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:0.8rem;font-weight:600;color:var(--ink-faint)}
.stp b{width:22px;height:22px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:0.7rem;background:var(--surface-2);color:var(--ink-soft)}
.stp.done{color:var(--ink-soft)} .stp.done b{background:var(--accent-dim);color:var(--accent)}
.stp.now{color:var(--ink);border-color:var(--line-strong)} .stp.now b{background:var(--accent);color:var(--accent-ink)}

/* ASSESSMENT */
.qmeta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:0.8rem;color:var(--card-sub);font-weight:600}
.progress{height:6px;border-radius:99px;background:var(--card-line);overflow:hidden;margin-top:10px}
.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--grad1),var(--grad2))}
.qtext{font-size:1.15rem;font-weight:700;margin-top:18px;max-width:60ch}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.opt{text-align:left;padding:13px 15px;border-radius:12px;border:1px solid var(--card-line);background:var(--card-soft);color:var(--card-ink);cursor:pointer;font-weight:500;line-height:1.4}
.opt:hover{border-color:var(--grad2)}
.opt.sel{border-color:var(--grad1);background:#E6F2EC;font-weight:700}

/* REPORT */
.scorehead{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.ring{width:132px;height:132px;flex:0 0 auto}
.band{display:inline-block;font-family:var(--f-mono);font-size:0.72rem;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;padding:4px 9px;border-radius:6px;background:#E6F2EC;color:var(--grad1)}
.bars{display:flex;flex-direction:column;gap:11px}
.bar{display:grid;grid-template-columns:minmax(0,190px) 1fr 44px;gap:12px;align-items:center;font-size:0.84rem}
.bar .track{height:8px;border-radius:99px;background:var(--card-line);overflow:hidden}
.bar .fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--grad1),var(--grad2))}
.bar .fill.low{background:var(--amber)}
.bar .pct{font-family:var(--f-mono);font-weight:700;text-align:right}
.bar .w{color:var(--card-sub);font-size:0.74rem}
.actions{display:flex;flex-direction:column;gap:10px;counter-reset:a}
.action{display:flex;gap:12px;padding:13px 14px;border-radius:12px;background:var(--card-soft);border:1px solid var(--card-line)}
.action::before{counter-increment:a;content:counter(a);flex:0 0 auto;width:24px;height:24px;border-radius:7px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:0.74rem;font-weight:700}
.action b{display:block}
.action span{color:var(--card-sub);font-size:0.84rem}
.paper h2{font-size:1.05rem;font-weight:700}
.paper .sub{color:var(--card-sub);font-size:0.86rem}
.divider{height:1px;background:var(--card-line);margin-block:4px}

/* EMPLOYER / CANDIDATES */
.rolecard{display:flex;flex-direction:column;gap:14px}
.rolehead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.rolehead h3{font-size:1.1rem}
.status{font-family:var(--f-mono);font-size:0.68rem;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;padding:4px 9px;border-radius:6px;white-space:nowrap}
.status.review{background:#FBF3C8;color:#7A6300}
.status.sent{background:var(--accent);color:var(--accent-ink)}
.cand{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;padding:14px 16px;border-radius:14px;border:1px solid var(--card-line);background:var(--card-soft)}
.cand .nm{font-weight:700}
.cand .meta{font-size:0.8rem;color:var(--card-sub)}
.cand .why{font-size:0.82rem;color:var(--card-ink);grid-column:1/-1}
.cand .gap{font-size:0.8rem;color:#9A5B05;grid-column:1/-1}
.cand .score{font-family:var(--f-mono);font-weight:700;font-size:1.3rem;color:var(--grad1);text-align:right}
.cand .score small{display:block;font-size:0.62rem;color:var(--card-sub);font-weight:600}
.cand .ctl{grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.cand select{padding:7px 10px;border-radius:8px;border:1px solid var(--card-line);background:#fff;color:var(--card-ink);font-weight:600}
.cand .contact{font-size:0.8rem;color:var(--card-sub);word-break:break-all}
.cand.off{opacity:0.5}

/* ADMIN */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:4px}
.kpi .num{font-family:var(--f-mono);font-size:1.5rem;font-weight:700;color:var(--ink)}
.kpi .num.ok{color:var(--accent)}
.kpi .lbl{font-size:0.78rem;color:var(--ink-faint)}
.kpi .tgt{font-size:0.74rem;color:var(--ink-soft);font-family:var(--f-mono)}
.funnel{display:flex;flex-direction:column;gap:8px}
.fstage{display:grid;grid-template-columns:120px minmax(0,1fr) 92px;gap:12px;align-items:center;font-size:0.84rem}
.fstage .ftrack{height:22px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.fstage .ffill{height:100%;background:linear-gradient(90deg,var(--grad2),var(--accent));border-radius:6px;min-width:2px}
.fstage .fnum{font-family:var(--f-mono);font-weight:700;text-align:right}
.fstage .fnum small{color:var(--ink-faint);font-weight:500}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:0.84rem}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:0.72rem;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-faint);font-weight:700;background:var(--surface)}
td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:none}
.ovr{width:70px;padding:6px 8px;border-radius:8px;border:1px solid var(--line-strong);background:var(--bg);color:var(--ink);font-family:var(--f-mono)}
.pill{font-size:0.72rem;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-soft);white-space:nowrap}
.pill.done{background:var(--accent-dim);color:var(--accent)}
/* HOME */
.hero{position:relative;padding-block:48px 24px;text-align:center}
.glow{position:absolute;inset:-100px -20% auto -20%;height:560px;pointer-events:none;z-index:0;filter:blur(6px);
  background:radial-gradient(460px 360px at 18% 22%,rgba(14,127,95,0.42),transparent 70%),radial-gradient(400px 320px at 82% 12%,rgba(215,242,78,0.14),transparent 70%),radial-gradient(560px 400px at 55% 60%,rgba(11,67,50,0.5),transparent 70%)}
.hero>*:not(.glow){position:relative;z-index:1}
.badge{display:inline-flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);padding:7px 14px;border-radius:999px;font-size:0.8rem;color:var(--ink-soft)}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}
.hero h1{font-family:var(--f-display);font-weight:400;text-transform:uppercase;font-size:clamp(2.8rem,9vw,5.6rem);line-height:0.92;margin-top:22px}
.hero h1 .hl{color:var(--accent)}
.hero .lead{max-width:56ch;margin:20px auto 0;color:var(--ink-soft);font-size:1.06rem;line-height:1.6}
.hero .row{justify-content:center;margin-top:26px}
.loop{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:6px}
@media (max-width:820px){.loop{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:460px){.loop{grid-template-columns:1fr}}
.loopstep{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:8px}
.loopstep .n{font-family:var(--f-mono);font-size:0.72rem;font-weight:700;color:var(--accent-ink);background:var(--accent);width:26px;height:26px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center}
.loopstep h3{font-size:0.98rem}
.loopstep p{font-size:0.86rem;color:var(--ink-soft)}
.secthead{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
.secthead h2{font-size:1.6rem;font-weight:700;letter-spacing:-0.01em}
.homesec{padding-block:36px}
.aud{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:860px){.aud{grid-template-columns:1fr}}
.audcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:14px}
.audcard.lead-card{background:var(--card);color:var(--card-ink);border-color:transparent}
.audcard .who{font-family:var(--f-mono);font-size:0.68rem;letter-spacing:0.06em;text-transform:uppercase;font-weight:700;color:var(--accent)}
.audcard.lead-card .who{color:var(--grad1)}
.audcard h3{font-size:1.2rem;line-height:1.25}
.audcard ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px;font-size:0.88rem;color:var(--ink-soft)}
.audcard.lead-card ul{color:var(--card-sub)}
.audcard li{display:flex;gap:9px}
.audcard li::before{content:"→";color:var(--accent);font-weight:700}
.audcard.lead-card li::before{color:var(--grad2)}
.audcard .btn{align-self:flex-start;margin-top:auto}
.audcard .soon{font-size:0.8rem;color:var(--ink-faint);margin-top:auto}
.scorestrip{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:22px;align-items:center}
@media (max-width:820px){.scorestrip{grid-template-columns:1fr}}
.scorestrip .paper .bars{margin-top:14px}
.pilotnote{display:flex;gap:14px;flex-wrap:wrap;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:22px;color:var(--ink-faint);font-size:0.84rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--accent);color:var(--accent-ink);font-weight:700;padding:10px 16px;border-radius:10px;z-index:50;font-size:0.88rem}
@media (prefers-reduced-motion:no-preference){.fill,.ffill,.progress span{transition:width .4s ease}}
</style>

<nav>
  <div class="navcard">
    <div class="brand"><div class="brandmark">I+</div><div class="brandword">Intern+</div><span class="pilottag">Pilot</span></div>
    <div class="tabswitch" role="tablist" aria-label="Choose a view" id="tabs"></div>
  </div>
</nav>
<main class="wrap" id="app"></main>
<div class="toast" id="toast" hidden></div>

<script>
/* ---------- CONTENT ---------- */
const UNIS=['AUC','GUC','Cairo University','Ain Shams University','Alexandria University','BUE','Helwan University','Other'];
const MAJORS=['Business Administration','Commerce','Marketing','Economics','Computer Science','Engineering','Mass Communication','Other'];
const YEARS=['2025','2026','2027','2028'];
const CITIES=['Cairo','Giza','Alexandria','Other'];
const SKILLS=['Excel','Power BI','SQL','Python','Data analysis','Social media','Content writing','Copywriting','Sales','Customer service','Canva','Adobe Creative Suite','Project management','Public speaking','Research','Accounting','HR basics','Arabic/English bilingual'];
const CATS=[
 {k:'comm',name:'Communication',w:0.20},
 {k:'prob',name:'Problem solving',w:0.20},
 {k:'prof',name:'Professional readiness',w:0.20},
 {k:'digi',name:'Digital skills',w:0.15},
 {k:'exp',name:'Experience & activities',w:0.25}];
// Draft question bank v1 (to be replaced by Sara's validated bank). pts: 2 best, 1 partial, 0 weak.
const QS=[
 {id:'c1',cat:'comm',q:'Your manager asks for a quick project update by email. Which opening works best?',o:[['"Hi, so basically a lot happened this week and I will explain everything."',0],['"Status: on track. The report is 80% done and ready Thursday. One risk: we still need the sales data."',2],['"Please see attached."',0],['"Sorry for the delay, full details below."',1]]},
 {id:'c2',cat:'comm',q:'In a meeting, a senior colleague quotes a number from your analysis incorrectly. What do you do?',o:[['Correct them firmly in front of everyone',1],['Say nothing, it is not your place',0],['Politely add: "Just to confirm, the latest figure is 12%. I can share the source."',2],['Email the whole team afterwards pointing out the mistake',0]]},
 {id:'c3',cat:'comm',q:'A client asks a question you cannot answer yet. What is the best reply?',o:[['Wait until you have the full answer before replying',0],['"Thanks for your message. I am checking with the team and will reply by 3 pm today."',2],['"I don\'t know."',0],['Forward it to your manager without replying to the client',1]]},
 {id:'p1',cat:'prob',q:'A shop\'s sales fell 20% this month. What do you check first?',o:[['Launch a discount straight away',0],['Whether the drop is across all products and channels, or in one',2],['Assume it is seasonal and wait',0],['Ask followers on social media why they stopped buying',1]]},
 {id:'p2',cat:'prob',q:'A course costs EGP 1,200. With a 25% student discount, what do you pay?',o:[['EGP 900',2],['EGP 950',0],['EGP 300',0],['EGP 1,175',0]]},
 {id:'p3',cat:'prob',q:'You have three tasks due today and time for two. What do you do?',o:[['Do the two easiest ones',0],['Ask your manager which matters most and flag that the third will slip',2],['Stay late and try to finish all three without telling anyone',1],['Start all three at the same time',0]]},
 {id:'r1',cat:'prof',q:'Traffic means you will be 20 minutes late for an interview. What do you do?',o:[['Arrive and explain when you get there',0],['Message or call before the start time with a new arrival time',2],['Skip the interview',0],['Send a message once the interview has started',1]]},
 {id:'r2',cat:'prof',q:'You spot a mistake in a report already sent to a client. What do you do?',o:[['Hope nobody notices',0],['Tell your manager right away and bring a corrected version',2],['Quietly fix it in next month\'s report',0],['Blame the data source',0]]},
 {id:'r3',cat:'prof',q:'Your feedback says your work is good but slow. What is your next step?',o:[['Ask which tasks took too long and what "fast enough" looks like',2],['Work extra hours without saying anything',1],['Explain that you prefer quality over speed',0],['Ignore it',0]]},
 {id:'d1',cat:'digi',q:'In Excel, which formula adds up the values in cells A1 to A10?',o:[['=SUM(A1:A10)',2],['=ADD(A1:A10)',0],['=TOTAL(A1:A10)',0],['=COUNT(A1:A10)',0]]},
 {id:'d2',cat:'digi',q:'What is the best way for a team to edit one version of a large file?',o:[['Email the file to each person',0],['A shared cloud document with edit access',2],['Pass it around on a USB stick',0],['Send it in a WhatsApp group',0]]},
 {id:'d3',cat:'digi',q:'Which password is strongest?',o:[['Ahmed1999',0],['password123',0],['A long phrase of unrelated words plus a number',2],['Your phone number',0]]}

const ACTIONS={
 comm:['Book a mock interview with an HR evaluator','Practise short written updates: status, progress, then risk.'],
 prob:['Work through three business cases with a mentor','Practise breaking a problem down before jumping to a fix.'],
 prof:['Join a workplace readiness session','Covers deadlines, owning mistakes and acting on feedback.'],

/* ---------- SCORING + MATCHING ---------- */
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
function catScores(s){
  const out={};
  for(const c of CATS){
    if(c.k==='exp'){out.exp=clamp(Math.min(3,+s.internships||0)*35+(+s.projects||0)*15+(+s.activities||0)*10,0,100);continue;}
    const qs=QS.filter(q=>q.cat===c.k);let p=0,a=0;
    for(const q of qs){const i=s.answers?.[q.id];if(i!=null){p+=q.o[i][1];a++;}}
    out[c.k]=a?Math.round(p/(2*qs.length)*100):0;
  }
  return out;
}
const totalOf=sc=>Math.round(CATS.reduce((t,c)=>t+c.w*(sc[c.k]||0),0));
const scoreOf=s=>(s.override!=null&&s.override!=='')?+s.override:(s.total??totalOf(catScores(s)));
function band(t){return t>=90?'Elite Talent':t>=80?'Highly Employable':t>=70?'Employable':t>=60?'Needs Development':'High Development Need';}
function blockers(s,r){
  const sk=new Set(s.skills||[]);const out=[];
  const miss=(r.must||[]).filter(x=>!sk.has(x));if(miss.length)out.push('missing must-have '+miss.join(', '));
  if(scoreOf(s)<(+r.minScore||0))out.push(`score below the ${r.minScore} minimum`);
  return out;
}
function match(s,r,loose){
  const sk=new Set(s.skills||[]);const must=r.must||[],nice=r.nice||[];
  if(!loose&&blockers(s,r).length)return null;
  const score=scoreOf(s);
  const req=[...must,...nice];const hit=req.filter(x=>sk.has(x));const miss=req.filter(x=>!sk.has(x));
  const skills=req.length?hit.length/req.length*100:100;
  const majorFit=!(r.majors||[]).length||(r.majors||[]).includes(s.major)?100:0;
  const gy=(r.years||[]);const gyFit=!gy.length||gy.includes(String(s.gradYear))?100:gy.some(y=>Math.abs(+y-(+s.gradYear))===1)?50:0;
  const locFit=!r.location||r.location==='Any'||r.location===s.location?100:0;
  const m=Math.round(0.40*skills+0.30*score+0.15*majorFit+0.10*gyFit+0.05*locFit);
  const parts=[];
  parts.push(req.length?`Has ${hit.length} of ${req.length} requested skills${hit.length?' ('+hit.slice(0,4).join(', ')+')':''}`:'No specific skills requested');
  parts.push(`Intern+ score ${score}, ${band(score)}`);
  if((r.majors||[]).length)parts.push(majorFit?`${s.major} matches the major you asked for`:`${s.major} is outside the majors you listed`);
  return {m,why:parts.join('. ')+'.',miss};
}
function ranked(r){
  return [...state.students.values()].filter(s=>s.status==='completed').map(s=>({s,x:match(s,r)})).filter(o=>o.x).sort((a,b)=>b.x.m-a.x.m);
}

    const req=role?.requests?.[t.id],inSl=role?.shortlist?.[t.id];
    const act=!role?`<span class="sub">Create a role to request an intro.</span>`:inSl?`<span class="status sent">In your shortlist</span>`:req?`<span class="status review">Intro requested</span><span class="sub">Intern+ will confirm and share contact details.</span>`:`<button class="btn btn-dark" data-intro="${t.id}">Request intro</button>`;
    const b=role?blockers(t,role):[];
    return `<div class="cand"><div><div class="nm">${alias(t.id)} ${t.sample?'<span class="sample">Sample</span>':''}</div><div class="meta">${esc(t.university)} · ${esc(t.major)} · Class of ${esc(t.gradYear)} · ${esc(t.location)}</div></div>
     <div class="score">${role?x.m+'%':t.total}<small>${role?'match':'Intern+ score'}</small></div>
     <div class="why">${role?esc(x.why):`Intern+ score ${t.total}, ${esc(band(t.total))}.`} Skills: ${esc((t.skills||[]).join(', '))}.</div>
     ${role&&b.length?`<div class="gap">Note: ${esc(b.join('; '))}</div>`:role&&x.miss.length?`<div class="gap">Missing: ${esc(x.miss.join(', '))}</div>`:''}
     <div class="ctl">${act}</div></div>`;}).join('');
  return `<div class="panel stack">
   <div class="grid3">
    <label class="f">Rank against role<select data-trole="1"><option value="">No role, rank by score</option>${roles.map(r=>`<option value="${r.id}"${r.id===state.tRole?' selected':''}>${esc(r.title)}</option>`).join('')}</select></label>
    ${sel('uni',UNIS.filter(u=>u!=='Other'),'University')}${sel('major',MAJORS.filter(m=>m!=='Other'),'Major')}
    ${sel('year',YEARS,'Graduation year')}${sel('skill',SKILLS,'Has skill')}${sel('min',['60','70','80','90'],'Minimum score')}
   </div>
   <p class="small muted">${list.length} assessed student${list.length===1?'':'s'} visible. Profiles are anonymous: names and contact details are shared only after Intern+ confirms an intro.</p></div>
   <div class="paper stack" style="gap:10px">${cards||'<p class="sub">No students match these filters yet.</p>'}</div>`;
}

function cardRow(c,extra){

function candRow(s,x,extra){
  return cardRow({name:s.name,sample:s.sample,university:s.university,major:s.major,gradYear:s.gradYear,location:s.location,match:x.m,why:x.why,miss:x.miss},extra);
}
const STATUSES=['Shortlisted','Interviewing','Hired','Not a fit'];
const ROLESTATE={review:['review','Intern+ reviewing'],live:['sent','Live · taking applications'],closed:['review','Closed']};
function roleCard(r){
  const sl=r.shortlist||{};const ids=Object.keys(sl).sort((a,b)=>(sl[b].match||0)-(sl[a].match||0));
  const rows=ids.map(id=>{const c=sl[id];const st=c.status||'Shortlisted';
    return cardRow(c,`<div class="ctl"><select aria-label="Status for ${esc(c.name)}" data-rid="${r.id}" data-sid="${id}">${STATUSES.map(o=>`<option${o===st?' selected':''}>${o}</option>`).join('')}</select>${c.source==='apply'||c.source==='request'?`<span class="pill" style="background:var(--card-line);color:var(--card-sub)">${c.source==='apply'?'Applied':'You requested'}</span>`:''}<span class="contact">${esc(c.email)}${c.phone?' · '+esc(c.phone):''}${c.cv?` · <a href="${esc(c.cv)}" target="_blank" rel="noopener" style="color:var(--grad1)">CV</a>`:''}</span></div>`);}).join('');
  const [cls,label]=ROLESTATE[r.status]||ROLESTATE.review;
  return `<div class="paper rolecard"><div class="rolehead"><div><h3>${esc(r.title)}</h3><p class="sub">${esc(r.company)} · ${esc(r.location||'Any')} · min score ${esc(r.minScore)}</p></div><span class="status ${cls}">${label}</span></div>
   ${Object.keys(r.requests||{}).filter(id=>!sl[id]).length?`<p class="sub">Intro requests waiting for Intern+: ${Object.keys(r.requests||{}).filter(id=>!sl[id]).length}</p>`:''}
   <div class="stack" style="gap:10px"><h2>Your shortlist <span class="sub">(${ids.length})</span></h2>${rows||`<p class="sub">${r.status==='review'?'Intern+ is reviewing this role before publishing it to students.':'Intern+ is reviewing applicants and the wider pool. Reviewed candidates appear here.'}</p>`}
   ${ids.length?`<div class="row"><button class="btn btn-dark" data-csv="${r.id}">Export shortlist (CSV)</button><span class="sub">Columns match common ATS imports.</span></div>`:''}</div></div>`;
}

/* ---------- ADMIN ---------- */
function viewAdmin(){
  const head=`<div class="pagehead"><span class="eyebrow">Intern+ team</span><h1>Pilot <span class="hl">control room</span></h1><p class="lead">Approve roles, review applicants and the wider pool, send shortlists, and track the pilot against its exit criteria.</p></div>`;
  if(!state.db)return head+noDb();
  const S=[...state.students.values()],R=allRoles();
  const started=S.filter(s=>s.answers&&Object.keys(s.answers).length).length;
  const completed=S.filter(s=>s.status==='completed');
  const applied=[...state.applications.values()].filter(a=>Object.keys(a.roles||{}).length).length;
  const sl=new Map();R.forEach(r=>Object.entries(r.shortlist||{}).forEach(([id,v])=>{const p=sl.get(id);const rank=STATUSES.indexOf(v.status||'Shortlisted');if(!sl.has(id)||(rank<3&&(p===3||rank>p)))sl.set(id,rank);}));
  const shortlisted=sl.size,interviewing=[...sl.values()].filter(x=>x===1||x===2).length,hired=[...sl.values()].filter(x=>x===2).length;
  const stages=[['Signed up',S.length],['Started',started],['Completed',completed.length],['Applied',applied],['Shortlisted',shortlisted],['Interviewing',interviewing],['Hired',hired]];
  const max=Math.max(1,S.length);
  const rate=started?Math.round(completed.length/started*100):0;
  const surv=completed.filter(s=>s.survey);const useful=surv.length?Math.round(surv.filter(s=>s.survey==='useful').length/surv.length*100):null;
  const employersUsing=new Set(R.filter(r=>Object.keys(r.shortlist||{}).length).map(r=>r.eid)).size;
  const cA=S.filter(s=>s.cohort==='A').length,cB=S.filter(s=>s.cohort==='B').length;
  const kpi=(n,ok,l,t)=>`<div class="kpi"><div class="num${ok?' ok':''}">${n}</div><div class="lbl">${l}</div><div class="tgt">${t}</div></div>`;
  const toApprove=R.filter(r=>r.status==='review').sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
  const live=R.filter(r=>r.status==='live'||Object.keys(r.requests||{}).some(id=>!(r.shortlist||{})[id])).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
  return head+`<div class="stack" style="gap:22px">
   <div class="kpis">
    ${kpi(completed.length,completed.length>=200,'Completed assessments','target 200 to 250')}
    ${kpi(rate+'%',rate>60,'Completion rate','target above 60%')}
    ${kpi(employersUsing,employersUsing>=2,'Employers with a shortlist','target 2')}
    ${kpi(interviewing,interviewing>=5,'Interviews from shortlists','target 5 or more')}
   </div>
   <div class="panel stack"><div class="row" style="justify-content:space-between"><h2 style="font-size:1.05rem">Pilot funnel</h2><span class="small muted mono">Cohort A (paid) ${cA} · Cohort B (sponsored) ${cB} · Report useful ${useful==null?'n/a':useful+'%'}</span></div>
    <div class="funnel">${stages.map(([l,n],i)=>`<div class="fstage"><div>${l}</div><div class="ftrack"><div class="ffill" style="width:${n/max*100}%"></div></div><div class="fnum">${n}${i?` <small>${stages[i-1][1]?Math.round(n/stages[i-1][1]*100):0}%</small>`:''}</div></div>`).join('')}</div></div>
   <div class="stack"><h2 style="font-size:1.05rem">Roles to approve <span class="faint small">(${toApprove.length})</span></h2>
    ${toApprove.length?toApprove.map(approveCard).join(''):`<div class="notice">No roles waiting. New role briefs from employers land here before they go live to students.</div>`}</div>
   <div class="stack"><h2 style="font-size:1.05rem">Shortlists and intro requests <span class="faint small">(${live.length})</span></h2>
    ${live.length?live.map(reviewCard).join(''):`<div class="notice">Approved roles appear here with their applicants and the best-matched candidates from the pool.</div>`}</div>
   <div class="stack"><div class="row" style="justify-content:space-between"><h2 style="font-size:1.05rem">Students <span class="faint small">(${S.length})</span></h2>
    ${S.some(s=>s.sample)?(state.confirmClear?`<div class="row"><span class="small muted">Delete all sample students?</span><button class="btn btn-outline" data-act="clearSamples">Yes, delete</button><button class="btn btn-ghost" data-act="cancelClear">Keep them</button></div>`:`<button class="btn btn-outline" data-act="askClear">Remove sample students</button>`):''}</div>
    <div class="tablewrap"><table><thead><tr><th>Name</th><th>University · major</th><th>Cohort</th><th>Status</th><th>Score</th><th>Band</th><th>Override</th><th>Report useful?</th></tr></thead><tbody>
    ${S.sort((a,b)=>scoreOf(b)-scoreOf(a)).map(s=>{const t=s.status==='completed'?scoreOf(s):null;return `<tr><td>${esc(s.name)} ${s.sample?'<span class="sample">Sample</span>':''}</td><td>${esc(s.university)} · ${esc(s.major)}</td><td>${esc(s.cohort||'none')}</td><td><span class="pill${s.status==='completed'?' done':''}">${esc(s.status==='completed'?'Completed':s.code?'In assessment':'Profile only')}</span></td><td class="num">${t??'n/a'}</td><td>${t==null?'':esc(band(t))}</td><td><input class="ovr" type="number" min="0" max="100" aria-label="Score override for ${esc(s.name)}" data-ovr="${s.id}" value="${s.override??''}" placeholder="auto"></td><td>${esc(s.survey||'')}</td></tr>`;}).join('')||'<tr><td colspan="8" class="muted">No students yet.</td></tr>'}
    </tbody></table></div></div>
  </div>`;
}
function roleMeta(r){return `<p class="sub">${esc(r.company)} · ${esc(r.location||'Any')} · min score ${esc(r.minScore)}${r.ats?' · ATS: '+esc(r.ats):''}</p><p class="sub">Must: ${esc((r.must||[]).join(', ')||'none')} · Nice: ${esc((r.nice||[]).join(', ')||'none')} · Majors: ${esc((r.majors||[]).join(', ')||'any')} · Years: ${esc((r.years||[]).join(', ')||'any')}</p>`;}
function approveCard(r){
  const n=ranked(r).length;
  return `<div class="paper rolecard"><div class="rolehead"><div><h3>${esc(r.title)}</h3>${roleMeta(r)}</div><span class="status review">Needs approval</span></div>
   <div class="row"><button class="btn btn-dark" data-approve="${r.id}" data-eid="${r.eid}">Approve and publish to students</button><span class="sub">${n} completed candidate${n===1?'':'s'} already meet the must-haves.</span></div></div>`;
}
function applicantsOf(rid){return [...state.applications.values()].filter(a=>a.roles?.[rid]).map(a=>a.id);}
function reviewCard(r){
  const sl=r.shortlist||{};const apps=new Set(applicantsOf(r.id));
  const pool=new Map();
  const reqs=new Set(Object.keys(r.requests||{}));
  for(const id of [...reqs,...apps]){const s=state.students.get(id);if(s&&s.status==='completed'&&!sl[id]&&!pool.has(id))pool.set(id,{s,x:match(s,r,true),applied:apps.has(id),requested:reqs.has(id)});}
  for(const o of ranked(r).slice(0,10))if(!sl[o.s.id]&&!pool.has(o.s.id))pool.set(o.s.id,{s:o.s,x:o.x,applied:false});
  const list=[...pool.values()].sort((a,b)=>b.x.m-a.x.m);
  if(!state.pick[r.id])state.pick[r.id]=new Set([...list.filter(o=>o.requested).map(o=>o.s.id),...list.filter(o=>!o.requested&&!blockers(o.s,r).length).slice(0,5).map(o=>o.s.id)]);
  const p=state.pick[r.id];for(const id of [...p])if(!pool.has(id))p.delete(id);
  return `<div class="paper rolecard"><div class="rolehead"><div><h3>${esc(r.title)}</h3>${roleMeta(r)}</div><span class="status ${r.status==='live'?'sent':'review'}">${r.status==='live'?'Live':'Not yet published'} · ${reqs.size} intro request${reqs.size===1?'':'s'} · ${apps.size} applied · ${Object.keys(sl).length} sent</span></div>
   <div class="stack" style="gap:10px">${list.length?list.map(o=>{const b=blockers(o.s,r);return `<label style="display:block;cursor:pointer">${candRow(o.s,o.x,`<div class="ctl"><input type="checkbox" data-pick="${r.id}" data-sid="${o.s.id}" ${p.has(o.s.id)?'checked':''} style="accent-color:var(--grad1)"> <span class="sub">Include</span>${o.requested?'<span class="pill" style="background:#FBF3C8;color:#7A6300">Intro requested</span>':''}${o.applied?'<span class="pill" style="background:var(--card-line);color:var(--card-sub)">Applied</span>':''}${b.length?`<span class="sub">Note: ${esc(b.join('; '))}</span>`:''}</div>`).replace('class="cand"',`class="cand${p.has(o.s.id)?'':' off'}"`)}</label>`;}).join(''):'<p class="sub">No new candidates to review. Everyone suitable has been sent, or nobody has applied or matched yet.</p>'}</div>
   <div class="row"><button class="btn btn-dark" data-send="${r.id}" data-eid="${r.eid}" ${p.size?'':'disabled'}>Send ${p.size} to ${esc(r.company)}</button><span class="sub">Only ticked candidates reach the employer, with contact details. Intro requests are ticked by default; untick to decline.</span></div></div>`;
}

/* ---------- EVENTS ---------- */
document.addEventListener('input',e=>{const k=e.target.dataset?.d;if(k)state.draft[k]=e.target.value;});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.dataset.d)state.draft[t.dataset.d]=t.value;
  if(t.id==='p-consent')state.draft.consent=t.checked;
  if(t.dataset.tf){state.tf[t.dataset.tf]=t.value;draw();}
  if(t.dataset.trole){state.tRole=t.value;draw();}
  if(t.id==='p-visible'){const s=meDoc();try{await state.db.doc('students/'+state.me).update({visible:t.checked});s.visible=t.checked;await syncTalent(s);toast(t.checked?'Your profile is visible to employers':'Your profile is hidden from employers');}catch(err){fail(err);}}
  if(t.dataset.rid){try{await state.db.doc('employers/'+state.me).update({roles:{[t.dataset.rid]:{shortlist:{[t.dataset.sid]:{status:t.value,updatedAt:Date.now()}}}}});toast('Status updated');}catch(err){fail(err);}}
  if(t.dataset.ovr){const v=t.value===''?null:clamp(+t.value,0,100);try{await state.db.doc('students/'+t.dataset.ovr).update({override:v});const st=state.students.get(t.dataset.ovr);if(st&&state.talent.has(st.id))await syncTalent({...st,override:v});toast(v==null?'Override removed':'Score set to '+v);}catch(err){fail(err);}}
  if(t.dataset.pick){const p=state.pick[t.dataset.pick];t.checked?p.add(t.dataset.sid):p.delete(t.dataset.sid);draw();}
});
function chipAct(el){
  if(el.dataset.skill){const k=el.dataset.skill,a=state.skills;a.includes(k)?a.splice(a.indexOf(k),1):a.push(k);draw();return true;}
  if(el.dataset.rskill){const k=el.dataset.rskill,r=state.role;if(r.must.includes(k))r.must=r.must.filter(x=>x!==k);else if(r.nice.includes(k)){r.nice=r.nice.filter(x=>x!==k);r.must.push(k);}else r.nice.push(k);draw();return true;}
  if(el.dataset.rlist){const a=state.role[el.dataset.rlist],v=el.dataset.val;a.includes(v)?a.splice(a.indexOf(v),1):a.push(v);draw();return true;}
  return false;
}
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList?.contains('chip')){e.preventDefault();chipAct(e.target);}});
async function upsert(path,data){const ref=state.db.doc(path);const snap=await ref.get();return snap.exists?ref.update(data):ref.set(data);}
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-tab],[data-skill],[data-rskill],[data-rlist],[data-ans],[data-act],[data-survey],[data-send],[data-csv],[data-apply],[data-approve],[data-emptab],[data-intro]');if(!el)return;
  if(el.dataset.tab){state.tab=el.dataset.tab;state.err='';try{if(state.tab!=='admin')localStorage.setItem('ip_tab',state.tab);}catch(x){}if(state.tab!=='admin'&&location.hash==='#admin')history.replaceState(null,'',location.pathname+location.search);draw();window.scrollTo(0,0);return;}
  if(chipAct(el))return;
  if(el.dataset.emptab){state.empTab=el.dataset.emptab;state.err='';draw();return;}
  if(el.dataset.intro){try{await state.db.doc('employers/'+state.me).update({roles:{[state.tRole]:{requests:{[el.dataset.intro]:{at:Date.now()}}}}});toast('Intro requested. Intern+ will confirm.');}catch(err){fail(err);}return;}
  const db=state.db,ref=()=>db.doc('students/'+state.me);
  if(el.dataset.ans){
    const s=meDoc();const qid=el.dataset.q,j=+el.dataset.ans;
    s.answers={...(s.answers||{}),[qid]:j};
    if(state.qi<QS.length-1)state.qi++;draw();
    try{await ref().update({answers:{[qid]:j},status:'started'});}catch(err){fail(err);}
    return;
  }
  const a=el.dataset.act;
  if(a==='prevQ'){state.qi=Math.max(0,state.qi-1);draw();}
  if(a==='nextQ'){state.qi=Math.min(QS.length-1,state.qi+1);draw();}
  if(a==='finish'){const s=meDoc();const sc=catScores(s);try{await ref().update({status:'completed',scores:sc,total:totalOf(sc),completedAt:Date.now(),visible:true});Object.assign(s,{status:'completed',scores:sc,total:totalOf(sc),visible:true});await syncTalent(s);draw();window.scrollTo(0,0);}catch(err){fail(err);}}
  if(a==='editProfile'){state.editProfile=true;state.skills=null;state.draft={};state.err='';draw();window.scrollTo(0,0);}
  if(a==='cancelEdit'){state.editProfile=false;state.draft={};state.err='';draw();}
  if(a==='askClear'){state.confirmClear=true;draw();}
  if(a==='cancelClear'){state.confirmClear=false;draw();}
  if(a==='clearSamples'){state.confirmClear=false;try{for(const s of [...state.students.values()].filter(s=>s.sample))await db.doc('students/'+s.id).delete();toast('Sample students removed');}catch(err){fail(err);}}
  if(el.dataset.survey){try{await ref().update({survey:el.dataset.survey});toast('Thanks');}catch(err){fail(err);}}
  if(el.dataset.apply){try{await upsert('applications/'+state.me,{roles:{[el.dataset.apply]:{at:Date.now()}}});toast('Application sent');}catch(err){fail(err);}}
  if(el.dataset.approve){
    const r=allRoles().find(x=>x.id===el.dataset.approve&&x.eid===el.dataset.eid);
    const pub={eid:r.eid,title:r.title,company:r.company,location:r.location,minScore:r.minScore,must:r.must||[],nice:r.nice||[],majors:r.majors||[],years:r.years||[],publishedAt:Date.now()};
    try{await db.doc('openings/'+r.id).set(pub);await db.doc('employers/'+r.eid).update({roles:{[r.id]:{status:'live',publishedAt:pub.publishedAt}}});toast('Published to students');}catch(err){fail(err);}
  }
  if(el.dataset.send){
    const r=allRoles().find(x=>x.id===el.dataset.send&&x.eid===el.dataset.eid),p=state.pick[r.id];const apps=new Set(applicantsOf(r.id));const out={};
    for(const id of p){const s=state.students.get(id);if(!s)continue;const x=match(s,r,true);const t=scoreOf(s);
      out[id]={name:s.name,email:s.email,phone:s.phone||'',cv:s.cv||'',university:s.university,major:s.major,gradYear:s.gradYear,location:s.location,score:t,band:band(t),match:x.m,why:x.why,miss:x.miss,status:'Shortlisted',source:r.requests?.[id]?'request':apps.has(id)?'apply':'intern',sentAt:Date.now(),sample:!!s.sample};}
    try{await db.doc('employers/'+r.eid).update({roles:{[r.id]:{shortlist:out}}});delete state.pick[r.id];toast(Object.keys(out).length+' sent to '+r.company);}catch(err){fail(err);}
  }
  if(el.dataset.csv)exportCsv(rolesOf(myEmployer()).find(r=>r.id===el.dataset.csv));
});
document.addEventListener('submit',async e=>{
  e.preventDefault();const f=e.target;state.err='';const d=state.draft;
  if(f.id==='profileForm'){
    const s=meDoc();const g=k=>(d[k]??s?.[k]??'');
    const p={name:String(g('name')).trim(),email:String(g('email')).trim(),phone:String(g('phone')).trim(),location:g('location'),university:g('university'),major:g('major'),gradYear:g('gradYear'),cv:String(g('cv')).trim(),
      internships:clamp(+g('internships')||0,0,10),projects:clamp(+g('projects')||0,0,20),activities:clamp(+g('activities')||0,0,20),skills:[...state.skills],consent:!!(d.consent??s?.consent)};
    if(!p.name||!/^\S+@\S+\.\S+$/.test(p.email)||!p.university||!p.major||!p.gradYear||!p.location){state.err='Add your name, a valid email, city, university, major and graduation year.';draw();return;}
    if(!p.skills.length){state.err='Pick at least one skill you can already use.';draw();return;}
    if(!p.consent){state.err='Tick the consent box so we can share your results with pilot employers.';draw();return;}
    try{
      if(s){const merged={...s,...p};if(s.status==='completed'){const sc=catScores(merged);p.scores=sc;p.total=totalOf(sc);}await state.db.doc('students/'+state.me).update(p);await syncTalent({...s,...p});toast('Profile saved');}
      else{await state.db.doc('students/'+state.me).set({...p,status:'registered',answers:{},createdAt:Date.now()});}
      state.editProfile=false;state.draft={};draw();window.scrollTo(0,0);
    }catch(err){fail(err);}
  }
  if(f.id==='codeForm'){
    const c=String(d.code||'').trim().toUpperCase();const m=c.match(/^(PAID|SPON|TEAM)-[A-Z0-9]{2,}$/);
    if(!m){state.err='That code is not recognised. Codes look like PAID-1042 or SPON-AUC1. Check it and try again.';draw();return;}
    const cohort={PAID:'A',SPON:'B',TEAM:'Team'}[m[1]];
    try{await state.db.doc('students/'+state.me).update({code:c,cohort});state.draft={};state.qi=null;}catch(err){fail(err);}
  }
  if(f.id==='roleForm'){
    const r=state.role;const role={title:String(d.rtitle||'').trim(),company:String(d.rcompany||myEmployer()?.company||'').trim(),location:d.rlocation||'Any',minScore:clamp(+(d.rmin||60),0,100),
      must:[...r.must],nice:[...r.nice],majors:[...r.majors],years:[...r.years],ats:String(d.rats||'').trim(),status:'review',createdAt:Date.now(),shortlist:{}};
    if(!role.title||!role.company){state.err='Add the role title and your company name.';draw();return;}
    if(!role.must.length&&!role.nice.length){state.err='Pick at least one skill so we can rank candidates.';draw();return;}
    const rid='r'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    try{await upsert('employers/'+state.me,{company:role.company,roles:{[rid]:role}});state.draft={};state.role={must:[],nice:[],majors:[],years:[]};toast('Role submitted for review');}catch(err){fail(err);}
  }
});
async function exportCsv(r){
  if(!r)return;
  const cols=['Name','Email','Phone','University','Major','Graduation year','City','Match %','Intern+ score','Band','Why matched','Missing skills','Status','Applied','CV link'];
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const lines=[cols.map(q).join(',')];
  for(const c of Object.values(r.shortlist||{}))lines.push([c.name,c.email,c.phone,c.university,c.major,c.gradYear,c.location,c.match,c.score,c.band,c.why,(c.miss||[]).join('; '),c.status||'Shortlisted',c.source==='apply'?'Yes':'No',c.cv].map(q).join(','));
  const dl=window.claude?await window.claude.use('downloads'):null;
  if(!dl){toast('Downloads are not available in this view.');return;}
  try{await dl.save({filename:`intern-plus-shortlist-${r.title.replace(/[^a-z0-9]+/gi,'-').toLowerCase()}.csv`,data:lines.join('\r\n')});}
  catch(err){if(err?.code!=='declined')toast('The file could not be saved.');}
}

/* ---------- BOOT ---------- */
draw();
(async()=>{
  try{
    if(!window.claude)throw new Error('no runtime');
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    state.db=db;
    if(user){state.canEdit=await user.canEdit();state.me=await user.id();}
    state.ready=true;
    if(!db||!state.me){state.db=null;draw();return;}
    const toMap=snap=>new Map(snap.docs.map(d=>[d.id,{id:d.id,...d.data()}]));
    const one=(key,path)=>db.doc(path).onSnapshot(d=>{state[key]=d.exists?new Map([[d.id,{id:d.id,...d.data()}]]):new Map();render();},err=>console.error(err));
    const all=(key,path)=>db.collection(path).onSnapshot(snap=>{state[key]=toMap(snap);render();},err=>console.error(err));
    if(state.canEdit){all('students','students');all('employers','employers');all('applications','applications');}
    else{one('students','students/'+state.me);one('employers','employers/'+state.me);one('applications','applications/'+state.me);}
    all('openings','openings');all('talent','talent');
    draw();
  }catch(e){console.error(e);state.ready=true;state.db=null;draw();}
})();
</script>
