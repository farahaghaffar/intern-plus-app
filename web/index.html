<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Intern+</title>
<meta name="description" content="Intern+ connects Egypt's interns and fresh graduates with employers through one employability assessment.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: Intern+ website shell (dark, lime accent); app chrome on dark surfaces, the student report and employer shortlist on white "paper" panels like the site's demo panel. Single dark brand look. */
:root{
  color-scheme:dark;
  --bg:#0A0F0D; --surface:#141B17; --surface-2:#1B2420;
  --ink:#F4F7F5; --ink-soft:#9FB2AA; --ink-faint:#768A81;
  --line:rgba(244,247,245,0.10); --line-strong:rgba(244,247,245,0.20);
  --accent:#D7F24E; --accent-ink:#0A0F0D; --accent-dim:#2B3420;
  --card:#FFFFFF; --card-ink:#10151A; --card-sub:#5E6D66; --card-line:#E4E8E5; --card-soft:#F5F8F6;
  --grad1:#0B4332; --grad2:#0E7F5F;
  --amber:#E8A33D; --good:#5BD18B; --bad:#F07A6A;
  --f-display:'Bebas Neue','Arial Narrow',sans-serif;
  --f-body:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html{overflow-x:clip}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px;overflow-x:clip}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
button,input,select,textarea{font-family:inherit;font-size:inherit}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.wrap{max-width:1080px;margin-inline:auto}

/* NAV */
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;padding-block:14px}
.navcard{max-width:1080px;margin-inline:auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  background:rgba(20,27,23,0.85);backdrop-filter:blur(14px) saturate(140%);border:1px solid var(--line);border-radius:16px;padding:10px 14px}
.brand{display:flex;align-items:center;gap:10px}
.brandmark{width:34px;height:34px;border-radius:9px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--accent-ink)}
.brandword{font-weight:700;font-size:1.05rem;letter-spacing:-0.01em}
.pilottag{font-family:var(--f-mono);font-size:0.66rem;letter-spacing:0.06em;text-transform:uppercase;color:var(--accent);background:var(--accent-dim);padding:3px 8px;border-radius:6px;font-weight:600}
.tabswitch{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.tabbtn{border:none;background:transparent;color:var(--ink-soft);font-weight:700;font-size:0.85rem;padding:8px 16px;border-radius:999px;cursor:pointer}
.tabbtn.on{background:var(--accent);color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* COMMON */
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:0.8rem;font-weight:600;color:var(--ink-soft)}
.eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent)}
.pagehead{padding-block:28px 18px;display:flex;flex-direction:column;gap:10px}
.pagehead h1{font-family:var(--f-display);font-weight:400;text-transform:uppercase;font-size:clamp(2.4rem,7vw,4rem);line-height:0.92;letter-spacing:0.005em}
.pagehead h1 .hl{color:var(--accent)}
.pagehead .lead{color:var(--ink-soft);max-width:60ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}
.paper{background:var(--card);color:var(--card-ink);border-radius:18px;padding:22px;box-shadow:0 30px 60px -30px rgba(0,0,0,0.6)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:720px){.grid2,.grid3{grid-template-columns:1fr}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:10px;font-weight:700;font-size:0.88rem;cursor:pointer;border:1px solid transparent;white-space:nowrap}
.btn-accent{background:var(--accent);color:var(--accent-ink)}
.btn-outline{background:transparent;color:var(--ink);border-color:var(--line-strong)}
.btn-dark{background:var(--card-ink);color:#fff}
.btn-ghost{background:transparent;color:var(--ink-soft);border:none;padding:8px 10px}
.btn[disabled]{opacity:0.45;cursor:not-allowed}
.paper .btn-outline{color:var(--card-ink);border-color:var(--card-line)}
.small{font-size:0.82rem}
.muted{color:var(--ink-soft)}
.faint{color:var(--ink-faint)}
.notice{border:1px dashed var(--line-strong);border-radius:14px;padding:16px 18px;color:var(--ink-soft);font-size:0.9rem}
.notice strong{color:var(--ink)}
.sample{font-family:var(--f-mono);font-size:0.62rem;letter-spacing:0.05em;text-transform:uppercase;color:#7A6300;background:#FBF3C8;padding:2px 7px;border-radius:5px;font-weight:600;vertical-align:middle}

/* FORMS */
label.f{display:flex;flex-direction:column;gap:6px;font-size:0.82rem;font-weight:600;color:var(--ink-soft);min-width:0}
.f input,.f select,.f textarea{width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--line-strong);background:var(--bg);color:var(--ink);font-weight:500}
.f textarea{min-height:70px;resize:vertical}
.paper .f{color:var(--card-sub)}
.nextcard{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--accent);color:#0B0F0D;border-radius:16px;padding:18px 20px;margin-bottom:14px}
.nextcard b{display:block;font-size:1.05rem}.nextcard span{font-size:0.9rem}.nextcard .btn-accent{background:#0B0F0D;color:var(--accent)}
.ladder{display:grid;gap:4px}.lstep{display:flex;gap:14px;padding:7px 12px;border-radius:9px;color:var(--card-sub);font-size:0.88rem}.lstep .mono{min-width:84px}
.lstep.on{background:#E6F2EC;color:var(--card-ink);font-weight:700}
.areas{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}.area{border:1px solid var(--card-line);border-radius:12px;padding:14px;display:grid;gap:8px}
.abadge{font-size:0.72rem;font-weight:700;padding:3px 8px;border-radius:999px}.abadge.strong{background:#E6F2EC;color:#0E7F5F}.abadge.solid{background:#FBF3C8;color:#7A6300}.abadge.building{background:#FBE4E1;color:#9B2C22}
.tips{margin:6px 0 0;padding-left:18px;font-size:0.88rem;color:var(--card-sub);line-height:1.6}
details.rv{border:1px solid var(--card-line);border-radius:12px;padding:12px 14px}details.rv summary{cursor:pointer;display:flex;justify-content:space-between;gap:10px}
.rvq{border-top:1px solid var(--card-line);padding-top:10px;margin-top:10px;display:grid;gap:4px}.rvt{font-weight:600;color:var(--card-ink)}
.rvtag{font-size:0.7rem;font-weight:700;padding:2px 7px;border-radius:999px;margin-right:6px}.rvtag.ok{background:#E6F2EC;color:#0E7F5F}.rvtag.mid{background:#FBF3C8;color:#7A6300}.rvtag.no{background:#FBE4E1;color:#9B2C22}
.paper .f input,.paper .f textarea{background:#fff;color:var(--card-ink);border-color:var(--card-line)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:7px 13px;border-radius:999px;background:var(--surface-2);color:var(--ink-soft);font-size:0.82rem;font-weight:600;cursor:pointer;border:1px solid var(--line);user-select:none}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip.must{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.must::after{content:" · must";font-weight:700}
.check{display:flex;gap:10px;align-items:flex-start;font-size:0.86rem;color:var(--ink-soft)}
.check input{margin-top:3px;accent-color:var(--accent)}
.err{color:var(--bad);font-size:0.84rem}

/* STEPPER */
.stepper{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.stp{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:0.8rem;font-weight:600;color:var(--ink-faint)}
.stp b{width:22px;height:22px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:0.7rem;background:var(--surface-2);color:var(--ink-soft)}
.stp.done{color:var(--ink-soft)} .stp.done b{background:var(--accent-dim);color:var(--accent)}
.stp.now{color:var(--ink);border-color:var(--line-strong)} .stp.now b{background:var(--accent);color:var(--accent-ink)}

/* ASSESSMENT */
.qmeta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:0.8rem;color:var(--card-sub);font-weight:600}
.progress{height:6px;border-radius:99px;background:var(--card-line);overflow:hidden;margin-top:10px}
.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--grad1),var(--grad2))}
.qtext{font-size:1.15rem;font-weight:700;margin-top:18px;max-width:60ch}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.opt{text-align:left;padding:13px 15px;border-radius:12px;border:1px solid var(--card-line);background:var(--card-soft);color:var(--card-ink);cursor:pointer;font-weight:500;line-height:1.4}
.opt:hover{border-color:var(--grad2)}
.opt.sel{border-color:var(--grad1);background:#E6F2EC;font-weight:700}

/* REPORT */
.scorehead{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.ring{width:132px;height:132px;flex:0 0 auto}
.band{display:inline-block;font-family:var(--f-mono);font-size:0.72rem;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;padding:4px 9px;border-radius:6px;background:#E6F2EC;color:var(--grad1)}
.bars{display:flex;flex-direction:column;gap:11px}
.bar{display:grid;grid-template-columns:minmax(0,190px) 1fr 44px;gap:12px;align-items:center;font-size:0.84rem}
.bar .track{height:8px;border-radius:99px;background:var(--card-line);overflow:hidden}
.bar .fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--grad1),var(--grad2))}
.bar .fill.low{background:var(--amber)}
.bar .pct{font-family:var(--f-mono);font-weight:700;text-align:right}
.bar .w{color:var(--card-sub);font-size:0.74rem}
.actions{display:flex;flex-direction:column;gap:10px;counter-reset:a}
.action{display:flex;gap:12px;padding:13px 14px;border-radius:12px;background:var(--card-soft);border:1px solid var(--card-line)}
.action::before{counter-increment:a;content:counter(a);flex:0 0 auto;width:24px;height:24px;border-radius:7px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:0.74rem;font-weight:700}
.action b{display:block}
.action span{color:var(--card-sub);font-size:0.84rem}
.paper h2{font-size:1.05rem;font-weight:700}
.paper .sub{color:var(--card-sub);font-size:0.86rem}
.divider{height:1px;background:var(--card-line);margin-block:4px}

/* EMPLOYER / CANDIDATES */
.rolecard{display:flex;flex-direction:column;gap:14px}
.rolehead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.rolehead h3{font-size:1.1rem}
.status{font-family:var(--f-mono);font-size:0.68rem;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;padding:4px 9px;border-radius:6px;white-space:nowrap}
.status.review{background:#FBF3C8;color:#7A6300}
.status.sent{background:var(--accent);color:var(--accent-ink)}
.cand{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;padding:14px 16px;border-radius:14px;border:1px solid var(--card-line);background:var(--card-soft)}
.cand .nm{font-weight:700}
.cand .meta{font-size:0.8rem;color:var(--card-sub)}
.cand .why{font-size:0.82rem;color:var(--card-ink);grid-column:1/-1}
.cand .gap{font-size:0.8rem;color:#9A5B05;grid-column:1/-1}
.cand .score{font-family:var(--f-mono);font-weight:700;font-size:1.3rem;color:var(--grad1);text-align:right}
.cand .score small{display:block;font-size:0.62rem;color:var(--card-sub);font-weight:600}
.cand .ctl{grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.cand select{padding:7px 10px;border-radius:8px;border:1px solid var(--card-line);background:#fff;color:var(--card-ink);font-weight:600}
.cand .contact{font-size:0.8rem;color:var(--card-sub);word-break:break-all}
.cand.off{opacity:0.5}

/* ADMIN */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:4px}
.kpi .num{font-family:var(--f-mono);font-size:1.5rem;font-weight:700;color:var(--ink)}
.kpi .num.ok{color:var(--accent)}
.kpi .lbl{font-size:0.78rem;color:var(--ink-faint)}
.kpi .tgt{font-size:0.74rem;color:var(--ink-soft);font-family:var(--f-mono)}
.funnel{display:flex;flex-direction:column;gap:8px}
.fstage{display:grid;grid-template-columns:120px minmax(0,1fr) 92px;gap:12px;align-items:center;font-size:0.84rem}
.fstage .ftrack{height:22px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.fstage .ffill{height:100%;background:linear-gradient(90deg,var(--grad2),var(--accent));border-radius:6px;min-width:2px}
.fstage .fnum{font-family:var(--f-mono);font-weight:700;text-align:right}
.fstage .fnum small{color:var(--ink-faint);font-weight:500}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:0.84rem}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:0.72rem;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-faint);font-weight:700;background:var(--surface)}
td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:none}
.ovr{width:70px;padding:6px 8px;border-radius:8px;border:1px solid var(--line-strong);background:var(--bg);color:var(--ink);font-family:var(--f-mono)}
.pill{font-size:0.72rem;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-soft);white-space:nowrap}
.pill.done{background:var(--accent-dim);color:var(--accent)}
/* HOME */
.hero{position:relative;padding-block:48px 24px;text-align:center}
.glow{position:absolute;inset:-100px -20% auto -20%;height:560px;pointer-events:none;z-index:0;filter:blur(6px);
  background:radial-gradient(460px 360px at 18% 22%,rgba(14,127,95,0.42),transparent 70%),radial-gradient(400px 320px at 82% 12%,rgba(215,242,78,0.14),transparent 70%),radial-gradient(560px 400px at 55% 60%,rgba(11,67,50,0.5),transparent 70%)}
.hero>*:not(.glow){position:relative;z-index:1}
.badge{display:inline-flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);padding:7px 14px;border-radius:999px;font-size:0.8rem;color:var(--ink-soft)}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}
.hero h1{font-family:var(--f-display);font-weight:400;text-transform:uppercase;font-size:clamp(2.8rem,9vw,5.6rem);line-height:0.92;margin-top:22px}
.hero h1 .hl{color:var(--accent)}
.hero .lead{max-width:56ch;margin:20px auto 0;color:var(--ink-soft);font-size:1.06rem;line-height:1.6}
.hero .row{justify-content:center;margin-top:26px}
.loop{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:6px}
@media (max-width:820px){.loop{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:460px){.loop{grid-template-columns:1fr}}
.loopstep{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:8px}
.loopstep .n{font-family:var(--f-mono);font-size:0.72rem;font-weight:700;color:var(--accent-ink);background:var(--accent);width:26px;height:26px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center}
.loopstep h3{font-size:0.98rem}
.loopstep p{font-size:0.86rem;color:var(--ink-soft)}
.secthead{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
.secthead h2{font-size:1.6rem;font-weight:700;letter-spacing:-0.01em}
.homesec{padding-block:36px}
.aud{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:860px){.aud{grid-template-columns:1fr}}
.audcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:14px}
.audcard.lead-card{background:var(--card);color:var(--card-ink);border-color:transparent}
.audcard .who{font-family:var(--f-mono);font-size:0.68rem;letter-spacing:0.06em;text-transform:uppercase;font-weight:700;color:var(--accent)}
.audcard.lead-card .who{color:var(--grad1)}
.audcard h3{font-size:1.2rem;line-height:1.25}
.audcard ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px;font-size:0.88rem;color:var(--ink-soft)}
.audcard.lead-card ul{color:var(--card-sub)}
.audcard li{display:flex;gap:9px}
.audcard li::before{content:"→";color:var(--accent);font-weight:700}
.audcard.lead-card li::before{color:var(--grad2)}
.audcard .btn{align-self:flex-start;margin-top:auto}
.audcard .soon{font-size:0.8rem;color:var(--ink-faint);margin-top:auto}
.scorestrip{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:22px;align-items:center}
@media (max-width:820px){.scorestrip{grid-template-columns:1fr}}
.scorestrip .paper .bars{margin-top:14px}
.pilotnote{display:flex;gap:14px;flex-wrap:wrap;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:22px;color:var(--ink-faint);font-size:0.84rem}
.fsec{font-size:0.78rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--accent);font-weight:700;margin-top:6px;padding-top:14px;border-top:1px solid var(--line)}
.sgroups{display:flex;flex-direction:column;gap:12px}
.sgroup{display:flex;flex-direction:column;gap:6px}
.sglabel{font-size:0.74rem;color:var(--ink-faint);font-weight:600}
.f input[type=file]{padding:9px;cursor:pointer}
.acctmail{max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:640px){.acctmail{display:none}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--accent);color:var(--accent-ink);font-weight:700;padding:10px 16px;border-radius:10px;z-index:50;font-size:0.88rem}
@media (prefers-reduced-motion:no-preference){.fill,.ffill,.progress span{transition:width .4s ease}}
</style>
</head>
<body>
<nav>
  <div class="navcard">
    <div class="brand"><div class="brandmark">I+</div><div class="brandword">Intern+</div><span class="pilottag">Pilot</span></div>
    <div class="tabswitch" role="tablist" aria-label="Choose a view" id="tabs"></div>
    <div class="row" id="acct" style="gap:10px"></div>
  </div>
</nav>
<main class="wrap" id="app"></main>
<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script>
/* ---------- CONTENT ---------- */

const BANK=[{"id": "cm1", "level": 2, "cat": "comm", "q": "It is 9 pm. Your manager messages on WhatsApp asking for the sales report by 10 am tomorrow. You know it will realistically take until noon. What do you do?", "o": [["Reply now: \"I can send the key numbers by 10 and the full version by 12. Does that work, or is there one part you need first?\"", 3, "Best. You flag the problem early, offer what you can deliver, and let your manager choose."], ["Stay up late and finish it by 10 without mentioning the time it took", 2, "You deliver, but you hide a real constraint and set an expectation you cannot keep every time."], ["Reply first thing in the morning to say it will be ready by noon", 1, "Honest, but too late: your manager has no time left to plan around the delay."], ["Reply \"Sure, no problem\" and send it at noon", 0, "Agreeing to a deadline you know you will miss damages trust more than the delay itself."]], "why": "Good workplace communication means raising a problem as soon as you see it, with a solution, not after the deadline has passed.", "qf": {"tech": "It is 9 pm. Your manager messages on Slack asking for the test results for the new feature by 10 am tomorrow. You know it will realistically take until noon. What do you do?", "media": "It is 9 pm. Your manager messages on WhatsApp asking for the campaign content plan by 10 am tomorrow. You know it will realistically take until noon. What do you do?", "health": "It is 9 pm. Your supervisor messages on WhatsApp asking for the patient survey summary by 10 am tomorrow. You know it will realistically take until noon. What do you do?", "social": "It is 9 pm. Your manager messages on WhatsApp asking for the research summary by 10 am tomorrow. You know it will realistically take until noon. What do you do?"}}, {"id": "cm2", "level": 2, "cat": "comm", "q": "A client emails angrily because their order is three days late. The delay was the courier's fault. Which reply is best?", "o": [["Apologise, give a clear new date and what you have done to fix it, and offer a goodwill gesture if your policy allows", 3, "Best. It acknowledges the problem, gives certainty about what happens next, and repairs the relationship."], ["Apologise sincerely and promise it will not happen again", 2, "A good start, but the client still does not know when the problem will be solved."], ["Explain politely that someone else caused the delay and it was outside your control", 1, "It may be true, but to the client it sounds like an excuse. They care about the fix, not the blame."], ["Forward it to your manager because the client is upset", 0, "Escalating before trying to help makes you look unable to handle normal problems."]], "why": "An upset customer needs three things: to feel heard, to know what happens next and when, and to see that you have taken action.", "qf": {"tech": "A customer emails angrily because your company's app has been down for three hours. The outage was caused by your cloud provider. Which reply is best?", "media": "A client of your agency emails angrily because their campaign went live three days late. The delay was caused by the printing supplier. Which reply is best?", "health": "A patient's family member emails angrily because test results are three days late. The delay was caused by the external lab. Which reply is best?", "social": "A member of the public emails angrily because their request is three days late. The delay was caused by another department. Which reply is best?"}}, {"id": "cm3", "level": 2, "cat": "comm", "q": "You are presenting to senior managers. One interrupts with a question you planned to answer on slide 8 of 10. What do you do?", "o": [["Answer it in one or two sentences now, then say you will show the detail on slide 8", 3, "Best. Senior people want the answer now; you respect that and keep your structure."], ["Say \"Great question, I'll come to that shortly\" and continue", 2, "Polite, but it can feel like you are avoiding the question."], ["Skip ahead to slide 8 straight away", 1, "You answer, but you lose the flow and the slides in between."], ["Ask everyone to hold questions until the end", 0, "With senior managers this comes across as inflexible."]], "why": "When presenting, adapt to your audience. A short direct answer, then back to your plan, shows confidence and control."}, {"id": "cm4", "level": 2, "cat": "comm", "q": "You are messaging a hiring manager you have never met on LinkedIn. Which opening is strongest?", "o": [["\"Hi Ahmed, I saw your team is hiring growth interns. I grew our student club's Instagram from 2k to 9k followers in six months. Could I have 10 minutes of your time?\"", 3, "Best. It is personal, shows proof of a result, and makes a small, clear request."], ["\"Hi Ahmed, I'm a marketing student at Cairo University and I'm very interested in your growth team.\"", 2, "Polite and personal, but it gives no reason to reply and no clear ask."], ["\"Hi Ahmed, could you refer me to the growth internship?\"", 1, "Asking a stranger for a referral before showing any value rarely works."], ["\"Hello sir, I am a hardworking and passionate student looking for any opportunity.\"", 0, "Generic words like \"hardworking\" and \"any opportunity\" make you sound like everyone else."]], "why": "Strong outreach is specific: who you are, one concrete result, and one small request. Results beat adjectives.", "of": {"tech": ["\"Hi Ahmed, I saw your team is hiring backend interns. I built a timetable app that 1,200 students at my university use every week. Could I have 10 minutes of your time?\"", "\"Hi Ahmed, I'm a computer science student at Cairo University and I'm very interested in your engineering team.\"", "\"Hi Ahmed, could you refer me to the backend internship?\"", "\"Hello sir, I am a hardworking and passionate student looking for any opportunity.\""], "media": ["\"Hi Ahmed, I saw your agency is hiring content interns. I produced a video series for our student union that reached 150k views. Could I have 10 minutes of your time?\"", "\"Hi Ahmed, I'm a mass communication student at Cairo University and I'm very interested in your agency.\"", "\"Hi Ahmed, could you refer me to the content internship?\"", "\"Hello sir, I am a hardworking and passionate student looking for any opportunity.\""], "health": ["\"Hi Dr Ahmed, I saw your hospital is hiring quality interns. I ran a patient survey for 300 people during my training and presented the results to the department. Could I have 10 minutes of your time?\"", "\"Hi Dr Ahmed, I'm a pharmacy student at Cairo University and I'm very interested in your hospital.\"", "\"Hi Dr Ahmed, could you refer me to the quality internship?\"", "\"Hello sir, I am a hardworking and passionate student looking for any opportunity.\""], "social": ["\"Hi Ahmed, I saw your organisation is hiring research interns. I led a survey of 400 students on public transport that our faculty published. Could I have 10 minutes of your time?\"", "\"Hi Ahmed, I'm a political science student at Cairo University and I'm very interested in your organisation.\"", "\"Hi Ahmed, could you refer me to the research internship?\"", "\"Hello sir, I am a hardworking and passionate student looking for any opportunity.\""]}}, {"id": "cm5", "level": 2, "cat": "comm", "q": "A teammate on a shared project has missed two deadlines, and it is now delaying your part. What is your first move?", "o": [["Talk to them privately, ask what is blocking them, and agree a smaller next deadline together", 3, "Best. You find the real cause and fix it directly, without embarrassing anyone."], ["Tell your manager, with dates and the impact on your work", 2, "Reasonable if talking to them fails, but as a first step it skips a simple conversation."], ["Quietly do their part yourself so the project stays on track", 1, "It solves today's problem but hides it, and you cannot keep doing two jobs."], ["Mention it in the team group chat so everyone is aware", 0, "Calling someone out in public damages the relationship and rarely fixes the cause."]], "why": "Start with a direct, private conversation focused on solving the problem. Escalate only if that does not work."}, {"id": "cm6", "level": 2, "cat": "comm", "q": "An email says: \"We will move the launch to the 14th only if the supplier confirms the new packaging by Thursday. Otherwise we keep the 10th and launch with the current packaging.\" The supplier does not confirm by Thursday. What happens?", "o": [["The launch stays on the 10th with the current packaging", 3, "Correct. No confirmation means the \"otherwise\" plan applies."], ["The launch moves to the 14th with the current packaging", 0, "The move to the 14th only happens if the supplier confirms, which they did not."], ["The launch stays on the 10th with the new packaging", 0, "The new packaging was never confirmed, so it cannot be used."], ["The launch is postponed until the supplier confirms", 0, "The email gives a clear fallback, so nothing is postponed."]], "why": "Read conditions carefully: \"only if X, otherwise Y\" means Y happens whenever X does not."}, {"id": "pb1", "level": 2, "cat": "prob", "q": "Last week an online store had 2,400 visitors and 60 orders. This week visitors went up by 25% and the conversion rate (orders divided by visitors) stayed the same. How many orders did the store get this week?", "num": true, "answer": 75, "tol": 0, "why": "Conversion rate = 60 / 2,400 = 2.5%. Visitors this week = 2,400 x 1.25 = 3,000. Orders = 3,000 x 2.5% = 75. Shortcut: if the rate stays the same, orders also grow by 25%, so 60 x 1.25 = 75.", "qf": {"tech": "Last week an app had 2,400 new downloads and 60 paid sign-ups. This week downloads went up by 25% and the sign-up rate (sign-ups divided by downloads) stayed the same. How many paid sign-ups were there this week?", "media": "Last week a campaign landing page had 2,400 visitors and 60 sign-ups. This week visitors went up by 25% and the sign-up rate (sign-ups divided by visitors) stayed the same. How many sign-ups were there this week?", "health": "Last week a clinic's booking page had 2,400 visitors and 60 bookings. This week visitors went up by 25% and the booking rate (bookings divided by visitors) stayed the same. How many bookings were there this week?", "social": "Last week a petition page had 2,400 visitors and 60 signatures. This week visitors went up by 25% and the signing rate (signatures divided by visitors) stayed the same. How many signatures were there this week?"}}, {"id": "pb2", "level": 2, "cat": "prob", "q": "A product costs EGP 400 to make and sells for EGP 650. Delivery costs EGP 50 per order. What is the profit as a percentage of the selling price? Round to the nearest whole number.", "num": true, "answer": 31, "tol": 1, "why": "Profit = 650 - 400 - 50 = EGP 200. As a share of the selling price: 200 / 650 = 0.308, so about 31%. A common mistake is forgetting delivery (250 / 650 = 38%) or dividing by cost instead of price."}, {"id": "pb3", "level": 2, "cat": "prob", "q": "Monthly sales fell by 30%. Website visitors and the number of orders stayed about the same. What is the most likely explanation?", "o": [["Each order is worth less, for example because of discounts or cheaper products", 3, "Correct. Sales = orders x value per order. Orders did not change, so value per order must have dropped."], ["Demand dropped because of the season", 1, "Lower demand would show up as fewer visitors or orders, which did not happen."], ["Fewer people visited", 0, "The question says visitors stayed the same."], ["The checkout stopped working", 0, "Then the number of orders would have fallen, but it stayed the same."]], "why": "Break a number into its parts. Revenue = number of orders x average value per order. If one part is unchanged, the other must explain the change.", "qf": {"tech": "Monthly revenue from your company's app fell by 30%. Active users and the number of purchases stayed about the same. What is the most likely explanation?", "media": "Monthly revenue from an online design shop fell by 30%. Visitors and the number of orders stayed about the same. What is the most likely explanation?", "health": "A pharmacy's monthly sales fell by 30%. The number of customers and orders stayed about the same. What is the most likely explanation?", "social": "A university bookshop's monthly sales fell by 30%. The number of customers and purchases stayed about the same. What is the most likely explanation?"}}, {"id": "pb4", "level": 2, "cat": "prob", "q": "Your to-do list: (A) fix an error for a major client, due 3 pm today; (B) the weekly report your manager reads on Monday; (C) a colleague asked for 30 minutes of help today; (D) tidy your inbox. Which order is best?", "o": [["A, C, B, D", 3, "Best. Urgent and important first, then the short task that unblocks a colleague today, then the Monday report."], ["A, B, C, D", 2, "Close, but the report is not due until Monday while your colleague needs help today."], ["C, A, B, D", 1, "Helping first risks the client deadline at 3 pm."], ["B, A, C, D", 0, "Starting with Monday's report puts today's client deadline at risk."]], "why": "Order by deadline and impact: what is due soonest and matters most comes first; low-value tasks come last."}, {"id": "pb5", "level": 2, "cat": "prob", "q": "All interns at Company X speak English. Mona speaks English. Which statement must be true?", "o": [["Mona may or may not be an intern at Company X", 3, "Correct. Speaking English does not make someone an intern; many people speak English."], ["Mona is an intern at Company X", 0, "This reverses the rule. \"All interns speak English\" does not mean \"all English speakers are interns\"."], ["Mona is not an intern at Company X", 0, "Nothing rules her out either."], ["Everyone who speaks English works at Company X", 0, "The statement says nothing about everyone who speaks English."]], "why": "\"All A are B\" does not mean \"all B are A\". Be careful not to reverse a rule."}, {"id": "pb6", "level": 2, "cat": "prob", "q": "Your manager says \"make the pitch deck better\" before tomorrow's investor meeting. What do you do first?", "o": [["Ask who will be in the room and what decision the meeting needs to reach", 3, "Best. \"Better\" depends on the audience and the goal, so clarify those first."], ["Ask a colleague which slides feel weakest, then fix those", 2, "Useful input, but you still do not know what the investors need."], ["Redesign the slides so they look more modern", 1, "Looks matter less than whether the deck answers the investors' questions."], ["Add as much supporting data as possible to every slide", 0, "More data usually makes a deck harder to follow, not better."]], "why": "When a request is vague, define the goal before you start. Ten minutes of questions saves hours of the wrong work."}, {"id": "pr1", "level": 2, "cat": "prof", "q": "In your first week, you notice a team process that seems slow and inefficient. What do you do?", "o": [["Learn why it is done that way, then suggest an improvement with a small example", 3, "Best. You respect the team's context and still bring a fresh idea."], ["Suggest a better way in the next team meeting", 2, "Good initiative, but without the context there may be a reason you have missed."], ["Wait a few months until you understand the company before saying anything", 1, "Safe, but you lose the fresh view that new people bring."], ["Start doing it your own way without telling anyone", 0, "This can break things for others and damages trust."]], "why": "Understand first, then improve. New people add value by asking \"why\" before \"why not\"."}, {"id": "pr2", "level": 2, "cat": "prof", "q": "You realise a number you gave your manager yesterday was wrong, and it has already gone to a client. What do you do?", "o": [["Tell your manager right away with the correct number and a draft correction for the client", 3, "Best. Owning it fast, with a fix ready, limits the damage and builds trust."], ["Recheck all your other numbers first, then tell your manager tomorrow", 2, "Checking is good, but a day's delay lets the client act on a wrong number."], ["Correct it in next month's report", 1, "Too late, and it looks like you hoped nobody would notice."], ["Leave it, since the difference is small", 0, "Small errors that are hidden become big trust problems when found."]], "why": "Mistakes are normal. What employers judge is how fast and how honestly you fix them."}, {"id": "pr3", "level": 2, "cat": "prof", "q": "Your manager says your work is good but you take too long. What is your best response?", "o": [["Ask which tasks took too long and what time is reasonable, then check in again after two weeks", 3, "Best. You turn vague feedback into a clear target and show you are acting on it."], ["Work extra hours so you finish faster", 2, "It shows effort, but it does not fix how you work."], ["Explain that you take time because you care about quality", 1, "This sounds defensive and does not address the feedback."], ["Carry on as before, since the quality is good", 0, "Ignoring feedback is one of the fastest ways to lose a manager's trust."]], "why": "Treat feedback as information. Ask for specifics, agree a target, and follow up."}, {"id": "pr4", "level": 2, "cat": "prof", "q": "You are working remotely and finish your tasks early on Thursday afternoon. What do you do?", "o": [["Tell your manager you are done and suggest one or two useful things you could pick up", 3, "Best. You are visible, proactive and still aligned with your manager's priorities."], ["Start a project you think would help, and tell your manager about it on Sunday", 2, "Good initiative, but you may be working on the wrong thing."], ["Wait until someone gives you a new task", 1, "Not wrong, but it wastes time and makes you look passive."], ["Log off early, since the work is done", 0, "In remote work, disappearing without a word looks like you are not working."]], "why": "Proactive and visible beats busy and invisible, especially when working remotely."}, {"id": "pr5", "level": 2, "cat": "prof", "q": "A friend who works at a competitor asks when your company is launching its new product. What do you do?", "o": [["Say politely that you cannot share internal plans", 3, "Best. Clear and friendly, and it protects your company."], ["Check with your manager whether it is OK to share", 2, "Careful, but launch dates for a competitor are almost always confidential."], ["Give a vague hint without a date", 1, "Even hints can leak useful information."], ["Tell them, since it will be public soon anyway", 0, "Until it is public, it is confidential. Sharing it can cost you your job."]], "why": "Confidentiality is part of professionalism. When in doubt, do not share."}, {"id": "pr6", "level": 2, "cat": "prof", "q": "In an interview you are asked: \"What is your biggest weakness?\" Which answer is strongest?", "o": [["A real, specific weakness, plus what you are doing about it and an example of progress", 3, "Best. It shows self-awareness and that you act on it."], ["A real, specific weakness, explained honestly", 2, "Honest, but without the improvement part it leaves the interviewer worried."], ["\"I'm a perfectionist, so I sometimes work too hard.\"", 1, "Interviewers hear this every day and see it as avoiding the question."], ["\"I don't really have any major weaknesses.\"", 0, "Everyone has weaknesses; this suggests low self-awareness."]], "why": "Interviewers ask this to test self-awareness. Name a real weakness, then show what you are doing about it."}, {"id": "dg1", "level": 2, "cat": "digi", "q": "Order values are in cells B2 to B500. Which formula counts the orders above EGP 1,000?", "o": [["=COUNTIF(B2:B500,\">1000\")", 3, "Correct. COUNTIF counts the cells that meet a condition."], ["=IF(B2:B500>1000,1,0)", 1, "IF checks one value at a time; on its own it does not give a count."], ["=SUMIF(B2:B500,\">1000\")", 0, "SUMIF adds up the values instead of counting them."], ["=COUNT(B2:B500>1000)", 0, "COUNT does not take a condition like this."]], "why": "COUNTIF counts, SUMIF adds up, AVERAGEIF averages: each one only uses the cells that meet your condition."}, {"id": "dg2", "level": 2, "cat": "digi", "q": "You want an AI tool like ChatGPT or Claude to draft a cold email. Which prompt will give the best result?", "o": [["\"Write a 100-word cold email to the HR manager of a Cairo fintech, introducing me as a final-year business student who built a budgeting tool, asking for a 15-minute call. Friendly but professional.\"", 3, "Best. It gives the audience, who you are, one result, the goal, the length and the tone."], ["\"Write a professional cold email to an HR manager asking for an internship.\"", 2, "Clear goal, but the AI has to invent everything about you."], ["\"Write a cold email.\"", 1, "Too vague: you will get a generic template."], ["\"Make my email good.\"", 0, "The AI has no idea what \"good\" means for you."]], "why": "Good prompts give context: who it is for, who you are, the goal, and the format. The more specific, the more useful the result.", "of": {"tech": ["\"Write a 100-word cold email to the engineering manager of a Cairo software company, introducing me as a final-year computer science student who built a timetable app, asking for a 15-minute call. Friendly but professional.\"", "\"Write a professional cold email to an engineering manager asking for an internship.\"", "\"Write a cold email.\"", "\"Make my email good.\""], "media": ["\"Write a 100-word cold email to the creative director of a Cairo agency, introducing me as a final-year media student who produced a 150k-view video series, asking for a 15-minute call. Friendly but professional.\"", "\"Write a professional cold email to a creative director asking for an internship.\"", "\"Write a cold email.\"", "\"Make my email good.\""], "health": ["\"Write a 100-word cold email to the quality manager of a Cairo hospital, introducing me as a final-year pharmacy student who ran a 300-patient survey, asking for a 15-minute call. Friendly but professional.\"", "\"Write a professional cold email to a hospital manager asking for an internship.\"", "\"Write a cold email.\"", "\"Make my email good.\""], "social": ["\"Write a 100-word cold email to the programme manager of an NGO in Cairo, introducing me as a final-year political science student who led a 400-person survey, asking for a 15-minute call. Friendly but professional.\"", "\"Write a professional cold email to an NGO manager asking for an internship.\"", "\"Write a cold email.\"", "\"Make my email good.\""]}}, {"id": "dg3", "level": 2, "cat": "digi", "q": "An AI tool gives you a market size figure for Egypt with no source. You need it for a client slide. What do you do?", "o": [["Find the figure in a credible source, such as an official report, and cite that source", 3, "Best. AI tools can state wrong numbers confidently; a client slide needs a real source."], ["Use it, clearly labelled as an AI estimate", 2, "Honest, but clients expect verified numbers."], ["Ask the AI for its source and use the figure if it names one", 1, "AI tools sometimes invent sources too. You still need to open and check it."], ["Use it as it is, since AI tools are usually right", 0, "An unverified number in front of a client is a real risk."]], "why": "Use AI to speed up research, but verify facts and numbers in a source you can name.", "qf": {"tech": "An AI tool tells you how many people in Egypt use mobile banking, with no source. You need it for a product proposal. What do you do?", "media": "An AI tool gives you the number of Instagram users in Egypt, with no source. You need it for a client pitch. What do you do?", "health": "An AI tool gives you how common diabetes is in Egypt, with no source. You need it for a hospital presentation. What do you do?", "social": "An AI tool gives you Egypt's youth unemployment rate, with no source. You need it for a policy brief. What do you do?"}}, {"id": "dg4", "level": 2, "cat": "digi", "q": "Revenue was EGP 120,000 in January, EGP 90,000 in February and EGP 135,000 in March. By what percentage did revenue grow from February to March?", "num": true, "answer": 50, "tol": 0, "why": "Growth = (March - February) / February = (135,000 - 90,000) / 90,000 = 45,000 / 90,000 = 50%. The trap is comparing with January instead of February."}, {"id": "dg5", "level": 2, "cat": "digi", "q": "A client asks for a spreadsheet that includes your customers' names and phone numbers. They only need sales totals by city. What do you do?", "o": [["Share a version with only the totals by city, with access limited to the client", 3, "Best. Share only what is needed, and only with the person who needs it."], ["Share the full file as view-only with the client's email address", 2, "Access is limited, but you still share personal data they do not need."], ["Share the full file using \"anyone with the link\" so it is easy to open", 1, "Anyone who gets the link can see your customers' personal data."], ["Email the full file as an attachment", 0, "Once sent, you lose all control over who sees the personal data."]], "why": "Protect personal data: share the minimum needed, with the fewest people, and keep control of access.", "qf": {"tech": "A partner company asks for a spreadsheet that includes your app users' names and phone numbers. They only need sign-ups by city. What do you do?", "health": "A supplier asks for a spreadsheet that includes your patients' names and phone numbers. They only need prescription totals by city. What do you do?", "social": "A partner organisation asks for a spreadsheet that includes survey respondents' names and phone numbers. They only need results by city. What do you do?"}}, {"id": "dg6", "level": 2, "cat": "digi", "q": "Prices are in cells C2 to C101, and a few cells are empty. Which formula gives the correct average price?", "o": [["=AVERAGE(C2:C101)", 3, "Correct. AVERAGE skips empty cells, so it divides only by the prices that exist."], ["=SUM(C2:C101)/100", 1, "Dividing by 100 counts the empty cells too, so the average comes out too low."], ["=MEAN(C2:C101)", 0, "There is no MEAN function in Excel or Google Sheets."], ["=AVG(C2:C101)", 0, "There is no AVG function in Excel or Google Sheets."]], "why": "AVERAGE ignores empty cells. Dividing a total by a fixed count does not."}, {"id": "ucm1", "level": 1, "cat": "comm", "q": "You are emailing a professor you have never met to ask about a research assistant role. Which subject line is best?", "o": [["\"Research assistant role: second-year student, available from February\"", 3, "Best. It says what the email is about and gives a key fact, so it is easy to answer."], ["\"Research assistant role\"", 2, "Clear, but it gives no reason to open it first."], ["\"Hello\"", 1, "The professor cannot tell what the email is about."], ["\"URGENT: please read\"", 0, "Your request is not urgent for them, and this can look like spam."]], "why": "A good subject line tells the reader what the email is about and why it matters, before they open it."}, {"id": "ucm2", "level": 1, "cat": "comm", "q": "You need to set up a meeting with your project group. Which message in the group chat works best?", "o": [["\"Can we meet on Zoom for 30 minutes to split the report? Reply 1 for Tuesday 6 pm or 2 for Wednesday 6 pm.\"", 3, "Best. Clear purpose, length and two options make it easy for everyone to answer."], ["\"Can we meet this week to discuss the report?\"", 2, "Polite, but it will start a long back-and-forth about times."], ["\"Guys we need to meet\"", 1, "No purpose, no time: people will ignore it or ask questions."], ["\"Whoever is free, let's meet sometime\"", 0, "Too vague; the meeting probably will not happen."]], "why": "Make it easy to say yes: give the purpose, how long, and two or three concrete options."}, {"id": "ucm3", "level": 1, "cat": "comm", "q": "During your group presentation, a teammate shows a wrong number on a slide. What do you do?", "o": [["At a natural pause, politely add: \"Just to add, the latest figure is 12%.\"", 3, "Best. The audience gets the right number and your teammate is not embarrassed."], ["Fix the slide afterwards and tell your teammate in private", 2, "Kind, but the audience leaves with the wrong number."], ["Interrupt straight away to correct it", 1, "Correct, but it can embarrass your teammate and break the flow."], ["Say nothing, since it is their slide", 0, "The whole group shares responsibility for a wrong number."]], "why": "Correct mistakes in a way that fixes the information and protects the relationship."}, {"id": "ucm4", "level": 1, "cat": "comm", "q": "A recruiter calls while you are in a lecture and cannot talk. What do you do?", "o": [["Send a short text: \"Sorry, I'm in a lecture until 2 pm. Can I call you back at 2:15?\"", 3, "Best. Quick, polite, and gives a clear time to talk."], ["Call back when you are free that evening", 2, "You return the call, but they may have moved on to the next candidate."], ["Answer and whisper", 1, "It is hard to make a good impression when you cannot speak properly."], ["Ignore it and wait for them to call again", 0, "Recruiters often do not call twice."]], "why": "When you cannot talk, reply quickly with a specific time. Speed and clarity make a strong first impression."}, {"id": "ucm5", "level": 1, "cat": "comm", "q": "Your internship offer says: \"Start date is 1 February, provided we receive your university letter by 15 January.\" You send the letter on 20 January. What does this mean?", "o": [["The 1 February start date is no longer guaranteed", 3, "Correct. The start date depended on the letter arriving by 15 January."], ["You will definitely start on 1 February", 0, "\"Provided\" means the date depends on the condition, which was not met."], ["The offer is automatically cancelled", 0, "The condition is about the start date, not the offer itself."], ["You can start any time after 20 January", 0, "Nothing in the message says this."]], "why": "Read conditions carefully: \"X happens, provided Y\" means X may not happen if Y does not."}, {"id": "ucm6", "level": 1, "cat": "comm", "q": "You need to give feedback to a classmate whose slides have too much text. What is the best way to say it?", "o": [["\"Your content is strong. If you cut each slide to three key points, people will remember it better.\"", 3, "Best. Positive, specific, and it explains why the change helps."], ["\"The slides have too much text.\"", 2, "True and clear, but it can feel harsh and gives no direction."], ["\"Maybe ask someone else what they think.\"", 1, "Avoids the problem instead of helping."], ["\"Looks great!\"", 0, "Kind in the moment, but they miss the chance to improve."]], "why": "Helpful feedback is specific, kind, and explains how to improve."}, {"id": "upb1", "level": 1, "cat": "prob", "q": "A course costs EGP 1,200. With a 25% student discount, how much do you pay, in EGP?", "num": true, "answer": 900, "tol": 0, "why": "25% of 1,200 is 300. 1,200 - 300 = EGP 900. Shortcut: paying 75% means 1,200 x 0.75 = 900."}, {"id": "upb2", "level": 1, "cat": "prob", "q": "Your group needs 60 survey responses. You collected 15 a day for 3 days. How many more responses do you need?", "num": true, "answer": 15, "tol": 0, "why": "15 x 3 = 45 collected. 60 - 45 = 15 still needed."}, {"id": "upb3", "level": 1, "cat": "prob", "q": "The survey for your group project is getting very few responses. What should you check first?", "o": [["Where and how it was shared, and how long it takes to fill in", 3, "Best. Low responses usually come from reaching the wrong people or a survey that is too long."], ["Send it again to the same people with a reminder", 2, "Reminders help, but they do not fix the cause."], ["Add more questions so each response is more useful", 1, "Longer surveys usually get even fewer responses."], ["Make up some responses to reach the target", 0, "Inventing data is dishonest and can fail the whole project."]], "why": "Before trying fixes, find the cause. Ask where the problem starts."}, {"id": "upb4", "level": 1, "cat": "prob", "q": "You have an exam at 9 am tomorrow and an assignment due next week. You have 4 free hours tonight. What is the best plan?", "o": [["Study for the exam, then use any time left to start the assignment", 3, "Best. The exam is tomorrow, so it comes first; starting the assignment early makes next week easier."], ["Split the time equally between the exam and the assignment", 2, "Balanced, but it takes time away from tomorrow's exam."], ["Study for the exam, then stay up late to finish the assignment", 1, "Losing sleep before an exam usually hurts your result."], ["Work on the assignment because it is the bigger task", 0, "The exam is tomorrow; the assignment can wait."]], "why": "Put the nearest and most important deadline first, then use spare time to get ahead."}, {"id": "upb5", "level": 1, "cat": "prob", "q": "Every member of the debate club has spoken at a competition. Omar has spoken at a competition. What can you be sure of?", "o": [["Nothing more: Omar may or may not be in the debate club", 3, "Correct. Many people speak at competitions without being in the club."], ["Omar is in the debate club", 0, "This reverses the rule. \"All members spoke\" does not mean \"all speakers are members\"."], ["Omar is not in the debate club", 0, "Nothing rules him out either."], ["Everyone who has spoken at a competition is in the debate club", 0, "The rule only tells us about club members."]], "why": "\"All A are B\" does not mean \"all B are A\". Be careful not to reverse a rule."}, {"id": "upb6", "level": 1, "cat": "prob", "q": "Your student club's event has sold 40 of 200 tickets, one week before the date. What is the most useful first step?", "o": [["Ask a few people who did not buy why, and check where the event was promoted", 3, "Best. You find out the real reason before spending effort on fixes."], ["Cut the price by half", 2, "It might help, but price may not be the problem, and you lose money."], ["Post about it more often on the same page", 1, "If the wrong people see the page, more posts will not help."], ["Cancel the event", 0, "Giving up a week early, without trying anything, wastes the work done."]], "why": "Diagnose before you fix. A few quick questions often show the real problem.", "qf": {"tech": "Your student team's new app has 40 sign-ups out of a target of 200, one week before your demo day. What is the most useful first step?", "media": "Your student club's film screening has sold 40 of 200 tickets, one week before the date. What is the most useful first step?", "health": "Your student society's free health awareness day has 40 of 200 places booked, one week before the date. What is the most useful first step?", "social": "Your student club's panel discussion has 40 of 200 places booked, one week before the date. What is the most useful first step?"}, "of": {"tech": ["Ask a few people who tried it but did not sign up why, and check where it was promoted", "Make the app free for the first month", "Post about it more often on the same page", "Cancel the demo"], "health": ["Ask a few people who did not book why, and check where the event was promoted", "Add a free gift for everyone who books", "Post about it more often on the same page", "Cancel the event"], "social": ["Ask a few people who did not book why, and check where the event was promoted", "Add a free gift for everyone who books", "Post about it more often on the same page", "Cancel the event"]}}, {"id": "upr1", "level": 1, "cat": "prof", "q": "Traffic means you will be 15 minutes late to your first internship interview. What do you do?", "o": [["Call or message before the start time, apologise and give a realistic arrival time", 3, "Best. Telling them early shows respect for their time."], ["Message when you are 5 minutes away", 2, "Better than nothing, but they have already been waiting."], ["Arrive and explain when you get there", 1, "They spent 15 minutes not knowing if you were coming."], ["Do not go, since you will be late anyway", 0, "You lose the chance completely, and they may remember the no-show."]], "why": "Being late happens. Not telling people early is what damages trust."}, {"id": "upr2", "level": 1, "cat": "prof", "q": "On your first day at an internship, you are not sure how to do a task you were given. What do you do?", "o": [["Try for a short time, then ask a specific question and show what you already tried", 3, "Best. You show effort and respect your manager's time."], ["Ask your manager straight away", 2, "Asking is good, but trying first leads to better questions."], ["Search online for hours without asking", 1, "Effort is good, but hours of guessing wastes time a short question would save."], ["Leave it and hope no one notices", 0, "Unfinished work is always noticed, usually at the worst time."]], "why": "Asking questions is normal for interns. Try first, then ask a specific question.", "qf": {"tech": "On your first day at an internship, you are asked to set up the project on your laptop and the setup keeps failing. What do you do?", "health": "On your first day of training, you are not sure how to complete a form your supervisor gave you. What do you do?"}}, {"id": "upr3", "level": 1, "cat": "prof", "q": "You made a mistake in a group assignment that cost the group marks. What do you do?", "o": [["Tell your group, own the mistake, and suggest how to avoid it next time", 3, "Best. Owning it and learning from it builds trust."], ["Apologise to the group, but do not discuss it further", 2, "Honest, but the group misses the lesson for next time."], ["Stay quiet unless someone asks", 1, "If they find out later, it looks worse."], ["Say the instructions were unclear", 0, "Blaming something else makes people trust you less."]], "why": "Owning mistakes quickly, and learning from them, is one of the strongest signals of maturity."}, {"id": "upr4", "level": 1, "cat": "prof", "q": "Your internship manager says your report was hard to follow. What is the best response?", "o": [["Thank them and ask for one example of what would make it clearer", 3, "Best. You stay open and get a concrete way to improve."], ["Say thank you and try to improve it next time", 2, "Positive, but you are guessing what \"clearer\" means."], ["Explain why you wrote it that way", 1, "This sounds defensive."], ["Feel upset and ignore it", 0, "Ignoring feedback stops you improving and frustrates your manager."]], "why": "Feedback is a gift. Ask for one concrete example so you know exactly what to change."}, {"id": "upr5", "level": 1, "cat": "prof", "q": "A classmate asks to copy your assignment because they ran out of time. What do you do?", "o": [["Say no, but offer to explain how you approached it", 3, "Best. You protect your integrity and still help."], ["Say no politely", 2, "Right decision, but you could still help them learn."], ["Let them see it, but ask them not to copy", 1, "Once they have it, you cannot control what they do with it."], ["Send them the file", 0, "You both risk failing for academic dishonesty."]], "why": "Integrity matters at university and at work. You can say no and still be helpful."}, {"id": "upr6", "level": 1, "cat": "prof", "q": "Which email address is best to put on your CV?", "o": [["mona.ahmed@gmail.com", 3, "Best. Professional, easy to read, and it will still work after you graduate."], ["Your university email address", 2, "Professional, but many university accounts stop working after graduation."], ["mona2003@gmail.com", 1, "Fine, but the year is unnecessary and can make it look less professional."], ["princess.mona99@hotmail.com", 0, "Nicknames look unprofessional to employers."]], "why": "Small details on your CV shape first impressions. Use a simple, professional address that will last."}, {"id": "udg1", "level": 1, "cat": "digi", "q": "In Excel or Google Sheets, which formula adds up the numbers in cells A1 to A10?", "o": [["=SUM(A1:A10)", 3, "Correct. SUM adds up every number in the range."], ["=A1+A10", 1, "This only adds two cells, A1 and A10."], ["=ADD(A1:A10)", 0, "There is no ADD function in Excel or Google Sheets."], ["=COUNT(A1:A10)", 0, "COUNT tells you how many numbers there are, not their total."]], "why": "SUM adds a range of cells. The colon (A1:A10) means \"from A1 to A10\"."}, {"id": "udg2", "level": 1, "cat": "digi", "q": "You want an AI tool like ChatGPT or Claude to help you prepare for an interview. Which prompt is best?", "o": [["\"I have an interview for a marketing internship at a Cairo fintech. Ask me 5 likely questions one at a time and give feedback on each answer.\"", 3, "Best. It gives context and makes the AI coach you, so you actually practise."], ["\"Give me common interview questions.\"", 2, "Useful, but generic and you do not get feedback."], ["\"Help me with my interview.\"", 1, "Too vague for a useful answer."], ["\"Write my interview answers so I can memorise them.\"", 0, "Memorised answers sound fake, and you do not learn to think on the spot."]], "why": "Use AI as a coach, not a crutch. Give it context and ask it to make you practise.", "of": {"tech": ["\"I have an interview for a software internship at a Cairo tech company. Ask me 5 likely questions one at a time and give feedback on each answer.\"", "\"Give me common interview questions.\"", "\"Help me with my interview.\"", "\"Write my interview answers so I can memorise them.\""], "media": ["\"I have an interview for a content internship at a creative agency. Ask me 5 likely questions one at a time and give feedback on each answer.\"", "\"Give me common interview questions.\"", "\"Help me with my interview.\"", "\"Write my interview answers so I can memorise them.\""], "health": ["\"I have an interview for a training placement at a private hospital. Ask me 5 likely questions one at a time and give feedback on each answer.\"", "\"Give me common interview questions.\"", "\"Help me with my interview.\"", "\"Write my interview answers so I can memorise them.\""], "social": ["\"I have an interview for a research internship at an NGO. Ask me 5 likely questions one at a time and give feedback on each answer.\"", "\"Give me common interview questions.\"", "\"Help me with my interview.\"", "\"Write my interview answers so I can memorise them.\""]}}, {"id": "udg3", "level": 1, "cat": "digi", "q": "You are using AI to help with a university essay. What is the most responsible way?", "o": [["Use it to brainstorm and check your writing, write the essay yourself, and follow your university's AI rules", 3, "Best. You learn, the work is yours, and you stay within the rules."], ["Let it write a draft, then rewrite it in your own words", 2, "Better than copying, but the thinking is still mostly the AI's and may break the rules."], ["Copy its answer but change a few words", 1, "This is still the AI's work and is usually treated as cheating."], ["Submit what it writes as it is", 0, "This is plagiarism and can fail the course."]], "why": "AI is a powerful helper for ideas and editing. The thinking and the final work should be yours."}, {"id": "udg4", "level": 1, "cat": "digi", "q": "Your Instagram post had 2,000 views and 100 likes. What percentage of viewers liked it?", "num": true, "answer": 5, "tol": 0, "why": "Likes / views = 100 / 2,000 = 0.05, which is 5%.", "qf": {"tech": "Your app demo video had 2,000 views and 100 people clicked the download link. What percentage of viewers clicked it?", "health": "Your health awareness post had 2,000 views and 100 people booked a free check-up. What percentage of viewers booked?", "social": "Your club's post about a petition had 2,000 views and 100 people signed. What percentage of viewers signed?"}}, {"id": "udg5", "level": 1, "cat": "digi", "q": "You get an email saying your university account will be closed unless you click a link and enter your password. What do you do?", "o": [["Do not click it; check with your university's IT office using their official website or number", 3, "Best. This is a classic phishing email; checking through official channels keeps you safe."], ["Delete it", 2, "Safe, but reporting it helps protect other students."], ["Click the link but do not enter your password", 1, "Even clicking can be risky."], ["Enter your password to keep your account", 0, "This gives your account to the attacker."]], "why": "Real organisations never ask for your password by email. When in doubt, go to the official website yourself."}, {"id": "udg6", "level": 1, "cat": "digi", "q": "Your group is writing one report together. What is the best way to work on it?", "o": [["One shared online document that everyone edits, with comments for questions", 3, "Best. One version, everyone sees changes live, nothing gets lost."], ["One person collects everyone's parts by email and combines them", 2, "It works, but it is slow and depends on one person."], ["Everyone sends their part on WhatsApp", 1, "Files get lost in chat and formatting breaks."], ["Everyone keeps their own file and you combine them the night before", 0, "This almost always ends in a stressful last night."]], "why": "Shared online documents (Google Docs, Word online) keep one version and save a lot of time."}];
const FIELD_LABELS={"biz": "Business & Economics, and other fields", "tech": "Computing, Engineering and Sciences", "media": "Media, Communication, Design & Arts", "health": "Health & Life Sciences", "social": "Law, Politics & Humanities"};
const FIELD_KEY={'Business & Economics':'biz','Computing & IT':'tech','Engineering & Architecture':'tech','Sciences & Maths':'tech','Media & Communication':'media','Design & Arts':'media','Health & Life Sciences':'health','Law, Politics & Humanities':'social'};
const fieldKey=m=>FIELD_KEY[fieldOf(m)]||'biz';
const LEVELS={1:'Undergraduate level',2:'Graduate level'};
// Same rule as level_for() in the database: current students graduating after the coming summer get level 1.
function levelFor(status,grad){const d=new Date();const fy=d.getFullYear()+(d.getMonth()>=8?1:0);return (!status||status==='student')&&/^\d{4}$/.test(String(grad||''))&&+grad>fy?1:2;}
const levelOf=s=>s?.assessmentLevel||levelFor(s?.statusNow,s?.gradYear);
const qsFor=l=>BANK.filter(q=>q.level===l);
const QS=BANK;

/* ---------- SCORING + MATCHING ---------- */
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
function itemPts(q,v){
  if(v==null||v==='')return 0;
  if(q.num){const n=parseFloat(String(v).replace(/[^0-9.\-]/g,''));return isFinite(n)&&Math.abs(n-q.answer)<=q.tol?3:0;}
  return /^[0-3]$/.test(String(v))?q.o[+v][1]:0;
}
function catScores(s){
  if(s.status==='completed'&&s.scores)return s.scores;
  const out={};
  for(const c of CATS){
    if(c.k==='exp'){let e=clamp(Math.min(3,+s.internships||0)*35+(+s.projects||0)*15+(+s.activities||0)*10,0,100);if(!s.expVerified)e=Math.min(e,50);out.exp=e;continue;}
    const qs=qsFor(levelOf(s)).filter(q=>q.cat===c.k);let p=0;
    for(const q of qs)p+=itemPts(q,s.answers?.[q.id]);
    out[c.k]=Math.round(p/(3*qs.length)*100);
  }
  if(s.writingScore!=null)out.comm=Math.round((out.comm+s.writingScore)/2);
  return out;
}
const totalOf=sc=>Math.round(CATS.reduce((t,c)=>t+c.w*(sc[c.k]||0),0));
const scoreOf=s=>(s.override!=null&&s.override!=='')?+s.override:(s.total??totalOf(catScores(s)));
function band(t){return t>=90?'Elite Talent':t>=80?'Highly Employable':t>=70?'Employable':t>=60?'Needs Development':'High Development Need';}
function blockers(s,r){
  const sk=new Set(s.skills||[]);const out=[];
  const miss=(r.must||[]).filter(x=>!sk.has(x));if(miss.length)out.push('missing must-have '+miss.join(', '));
  if(scoreOf(s)<(+r.minScore||0))out.push(`score below the ${r.minScore} minimum`);
  return out;
}
// Match % = 35 skills + 25 Intern+ score + 10 field of study + 10 role area + 10 position type and timing + 5 stage and year + 5 location
function match(s,r,loose){
  const sk=new Set(s.skills||[]);const must=r.must||[],nice=r.nice||[];
  if(!loose&&blockers(s,r).length)return null;
  const score=scoreOf(s);
  const req=[...must,...nice];const hit=req.filter(x=>sk.has(x));const miss=req.filter(x=>!sk.has(x));
  const skills=req.length?hit.length/req.length*100:100;
  const fields=r.fields||[];const fieldFit=!fields.length||fields.includes(fieldOf(s.major))?100:0;
  const ints=s.roleInterests||[];const areaFit=!r.category?100:ints.includes(r.category)?100:ints.includes('Not sure yet')?50:0;
  const typeFit=!r.positionType||(s.positionTypes||[]).includes(r.positionType)?100:0;
  const d=s.duration;const durFit=!r.duration||d==='either'||(r.duration==='year_round'?d==='year_round':d==='breaks')?100:0;
  const stages=r.stages||[];const stageFit=!stages.length||stages.includes(s.statusNow)?100:0;
  const gy=r.years||[];const gyFit=!gy.length||gy.includes(String(s.gradYear))?100:gy.some(y=>Math.abs(+y-(+s.gradYear))===1)?50:0;
  const locFit=r.workMode==='Remote'||!r.location||r.location==='Any'||regionOf(s.location)===r.location?100:0;
  const m=Math.round(0.35*skills+0.25*score+0.10*fieldFit+0.10*areaFit+0.05*typeFit+0.05*durFit+0.025*stageFit+0.025*gyFit+0.05*locFit);
  const parts=[];
  parts.push(req.length?`Has ${hit.length} of ${req.length} requested skills${hit.length?' ('+hit.slice(0,4).join(', ')+')':''}`:'No specific skills requested');
  parts.push(`Intern+ score ${score}, ${band(score)}`);
  if(r.category)parts.push(areaFit===100?`wants ${r.category} roles`:areaFit===50?'open to any role area':`prefers ${ints.filter(x=>x!=='Not sure yet').slice(0,2).join(', ')||'other areas'}`);
  if(fields.length)parts.push(fieldFit?`${s.major} fits the fields you asked for`:`${s.major} is outside the fields you listed`);
  if(r.positionType&&!typeFit)parts.push(`not looking for ${r.positionType.toLowerCase()}`);
  if(r.duration&&!durFit)parts.push(d==='breaks'?'only available in summer or winter breaks':'looking for a year-round role');
  return {m,why:parts.map(x=>x[0].toUpperCase()+x.slice(1)).join('. ')+'.',miss};
}

}

function seeded(str){let h=1779033703^str.length;for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19;}
  return ()=>{h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);h^=h>>>16;return (h>>>0)/4294967296;};}
function shuffled(arr,rnd){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function qOrder(s){const rnd=seeded('order:'+state.me);return shuffled(qsFor(levelOf(s)),rnd);}

function alias(id){let h=0;for(const c of String(id))h=(h*31+c.charCodeAt(0))>>>0;return 'Candidate '+h.toString(36).toUpperCase().slice(-4).padStart(4,'0');}

    .map(t=>({t,x:role?match(t,role,true):null})).sort((a,b)=>role?b.x.m-a.x.m:b.t.total-a.t.total);

  const cards=list.map(({t,x})=>{

    const b=role?blockers(t,role):[];
    return `<div class="cand"><div><div class="nm">${alias(t.id)} ${t.sample?'<span class="sample">Sample</span>':''}${t.pct!=null?` <span class="pill">Top ${Math.max(1,100-t.pct)}%</span>`:''}${t.expVerified?' <span class="pill done">Experience verified</span>':''} <span class="pill">${t.level===1?'Undergraduate level':'Graduate level'}</span></div><div class="meta">${esc(t.university)} · ${esc(t.major)} · Class of ${esc(t.gradYear)} · ${esc(t.location)}</div><div class="meta">${esc(studentFacts(t))}</div></div>
     <div class="score">${role?x.m+'%':t.total}<small>${role?'match':'Intern+ score'}</small></div>
     <div class="why">${role?esc(x.why):`Intern+ score ${t.total}, ${esc(band(t.total))}.`} Skills: ${esc((t.skills||[]).join(', '))}.</div>
     ${role&&b.length?`<div class="gap">Note: ${esc(b.join('; '))}</div>`:role&&x.miss.length?`<div class="gap">Missing: ${esc(x.miss.join(', '))}</div>`:''}
     <div class="ctl">${act}</div></div>`;}).join('');
  return `<div class="panel stack">
   <div class="grid3">
    <label class="f">Rank against role<select data-trole="1"><option value="">No role, rank by score</option>${roles.map(r=>`<option value="${r.id}"${r.id===state.tRole?' selected':''}>${esc(r.title)}</option>`).join('')}</select></label>
    ${sel('area',[['Role area',ROLE_AREAS.filter(a=>a!=='Not sure yet')]],'Wants roles in')}
    <label class="f">Stage<select data-tf="stage">${optPairs(STATUS_NOW,f.stage||'','Any')}</select></label>
    ${sel('field',[['Field',FIELDS]],'Field of study')}${sel('uni',[['University',UNI_LIST.filter(x=>!UNI_TEXT.includes(x))]],'University')}${sel('year',[['Year',YEARS]],'Graduation year')}
    ${sel('region',[['Region',REGIONS]],'Lives in')}${sel('skill',SKILL_GROUPS,'Has skill')}${sel('min',[['Score',['60','70','80','90']]],'Minimum score')}
   </div>
   <p class="small muted">${list.length} assessed intern${list.length===1?'':'s'} visible. Profiles are anonymous: names, contact details and CVs are shared only after Intern+ confirms an intro.</p></div>
   <div class="paper stack" style="gap:10px">${cards||'<p class="sub">No interns match these filters yet.</p>'}</div>`;
}

function roleFacts(r){return [r.category,r.positionType,roleDurationLabel(r.duration),r.workMode,r.location&&r.location!=='Any'?r.location:'',r.startWhen?'start '+r.startWhen.toLowerCase():''].filter(Boolean).join(' · ');}

/* ---------- ADMIN ---------- */
function viewAdmin(){
  const head=`<div class="pagehead"><span class="eyebrow">Intern+ team</span><h1>Pilot <span class="hl">control room</span></h1><p class="lead">Approve roles, review applicants and the wider pool, send shortlists, and track the pilot against its exit criteria.</p></div>`;
  {const g=gate('admin');if(g)return head+g;}
  const refresh=`<div class="row"><button class="btn btn-outline" data-act="reload">Refresh data</button></div>`;
  const S=[...state.students.values()],R=allRoles();
  const started=S.filter(s=>s.answers&&Object.keys(s.answers).length).length;
  const completed=S.filter(s=>s.status==='completed');
  const applied=[...state.applications.values()].filter(a=>Object.keys(a.roles||{}).length).length;
  const sl=new Map();R.forEach(r=>Object.entries(r.shortlist||{}).forEach(([id,v])=>{const p=sl.get(id);const rank=STATUSES.indexOf(v.status||'Shortlisted');if(!sl.has(id)||(rank<3&&(p===3||rank>p)))sl.set(id,rank);}));
  const shortlisted=sl.size,interviewing=[...sl.values()].filter(x=>x===1||x===2).length,hired=[...sl.values()].filter(x=>x===2).length;
  const stages=[['Signed up',S.length],['Started',started],['Completed',completed.length],['Applied',applied],['Shortlisted',shortlisted],['Interviewing',interviewing],['Hired',hired]];
  const max=Math.max(1,S.length);

  const live=R.filter(r=>r.status==='live'||Object.keys(r.requests||{}).some(id=>!(r.shortlist||{})[id])).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
  return head+refresh+`<div class="stack" style="gap:22px;margin-top:16px">
   <div class="kpis">

    ${kpi(rate+'%',rate>60,'Completion rate','target above 60%')}

   <div class="panel stack"><div class="row" style="justify-content:space-between"><h2 style="font-size:1.05rem">Pilot funnel</h2><span class="small muted mono">Free pilot · ${S.length} intern${S.length===1?'':'s'} · Report useful ${useful==null?'n/a':useful+'%'}</span></div>
    <div class="funnel">${stages.map(([l,n],i)=>`<div class="fstage"><div>${l}</div><div class="ftrack"><div class="ffill" style="width:${n/max*100}%"></div></div><div class="fnum">${n}${i?` <small>${stages[i-1][1]?Math.round(n/stages[i-1][1]*100):0}%</small>`:''}</div></div>`).join('')}</div></div>
   ${adminWriting(S)}
   ${adminWaitlist(S)}
   ${adminQuality(S)}
   <div class="stack"><h2 style="font-size:1.05rem">Roles to approve <span class="faint small">(${toApprove.length})</span></h2>
    ${toApprove.length?toApprove.map(approveCard).join(''):`<div class="notice">No roles waiting. New role briefs from employers land here before they go live to interns.</div>`}</div>
   <div class="stack"><h2 style="font-size:1.05rem">Shortlists and intro requests <span class="faint small">(${live.length})</span></h2>
    ${live.length?live.map(reviewCard).join(''):`<div class="notice">Approved roles appear here with their applicants and the best-matched candidates from the pool.</div>`}</div>
   <div class="stack"><div class="row" style="justify-content:space-between"><h2 style="font-size:1.05rem">Interns <span class="faint small">(${S.length})</span></h2>
    ${S.some(s=>s.sample)?(state.confirmClear?`<div class="row"><span class="small muted">Delete all sample interns?</span><button class="btn btn-outline" data-act="clearSamples">Yes, delete</button><button class="btn btn-ghost" data-act="cancelClear">Keep them</button></div>`:`<button class="btn btn-outline" data-act="askClear">Remove sample interns</button>`):''}</div>
    <div class="tablewrap"><table><thead><tr><th>Name</th><th>University · major</th><th>Stage</th><th>Status</th><th>Score</th><th>Band</th><th>Exp. verified</th><th>Override</th><th>Report useful?</th><th></th></tr></thead><tbody>
    ${S.sort((a,b)=>scoreOf(b)-scoreOf(a)).map(s=>{const t=s.status==='completed'?scoreOf(s):null;return `<tr><td>${esc(s.name)} ${s.sample?'<span class="sample">Sample</span>':''}</td><td>${esc(s.university)} · ${esc(s.major)}</td><td>${esc(statusLabel(s.statusNow)||'n/a')}</td><td><span class="pill${s.status==='completed'?' done':''}">${esc(s.status==='completed'?'Completed':s.status==='started'?'In assessment':'Profile only')}</span></td><td class="num">${t??'n/a'}</td><td>${t==null?'':esc(band(t))}</td><td><input type="checkbox" data-expv="${s.id}" ${s.expVerified?'checked':''} aria-label="Experience verified for ${esc(s.name)}" style="accent-color:var(--grad1)">${s.cvPath?' '+cvLink(s.cvPath):''}</td><td><input class="ovr" type="number" min="0" max="100" aria-label="Score override for ${esc(s.name)}" data-ovr="${s.id}" value="${s.override??''}" placeholder="auto"></td><td>${esc(s.survey||'')}</td><td>${s.sample||s.status==='registered'&&!Object.keys(s.answers||{}).length?'':state.confirmReset===s.id?`<button class="btn btn-outline" data-reset="${s.id}" style="padding:4px 8px">Confirm reset</button>`:`<button class="btn btn-ghost" data-askreset="${s.id}" style="padding:4px 8px">Reset test</button>`}</td></tr>`;}).join('')||'<tr><td colspan="10" class="muted">No interns yet.</td></tr>'}
    </tbody></table></div></div>
  </div>`;
}
function adminWriting(S){

  const todo=list.filter(s=>s.writingScore==null).length;

function adminWaitlist(S){

function adminQuality(S){
  const done=S.filter(s=>s.status==='completed'&&!s.sample);
  const rows=BANK.map(q=>{const pool=done.filter(s=>levelOf(s)===q.level&&s.answers&&q.id in s.answers);const n=pool.length;
    const best=pool.filter(s=>itemPts(q,s.answers[q.id])===3).length,to=pool.filter(s=>s.answers[q.id]===-1||s.answers[q.id]==='').length;
    const pct=n?Math.round(best/n*100):null;const flag=n>=10&&pct>85?'Too easy':n>=10&&pct<15?'Check wording':'';
    return `<tr><td class="mono">${q.id}</td><td>${q.level===1?'Undergrad':'Grad'}</td><td>${esc(CATS.find(c=>c.k===q.cat).name)}</td><td>${esc(q.q.length>80?q.q.slice(0,80)+'…':q.q)}</td><td class="num">${n}</td><td class="num">${pct==null?'n/a':pct+'%'}</td><td class="num">${to}</td><td>${flag?`<span class="pill">${flag}</span>`:''}</td></tr>`;}).join('');
  const l1=done.filter(s=>levelOf(s)===1).length,l2=done.length-l1;
  return `<details class="panel"><summary style="cursor:pointer"><b>Question quality</b> <span class="small muted">· ${l1} undergraduate and ${l2} graduate-level interns completed · flags appear from 10 answers</span></summary>

}

function reviewCard(r){

  }
  if(f.id==='roleForm'){
    const r=state.role;const role={title:String(d.rtitle||'').trim(),company:String(d.rcompany||myEmployer()?.company||'').trim(),location:d.rlocation||'Any',min_score:clamp(+(d.rmin||60),0,100),
      category:d.rcategory||'',position_type:d.rtype||'',duration:d.rduration||'',start_when:d.rstart||'',work_mode:d.rmode||'',
      must:[...r.must],nice:[...r.nice],fields:[...r.fields],stages:[...r.stages],years:[...r.years],ats:String(d.rats||'').trim()};
    const errs=[];if(!role.title)errs.push('the role title');if(!role.company)errs.push('your company name');if(!role.category)errs.push('the role area');
    if(!role.position_type)errs.push('the position type');if(!role.duration)errs.push('the timing');if(!role.work_mode)errs.push('the work mode');
    if(!role.must.length&&!role.nice.length)errs.push('at least one skill');
    if(errs.length){state.err='Please add '+errs.join(', ')+'.';draw();return;}
    try{await q(sb.from('roles').insert(role).select('id'));state.draft={};state.role={must:[],nice:[],fields:[],stages:[],years:[]};toast('Role submitted for review');await load();}catch(err){fail(err);}
  }
});
function exportCsv(r){
  if(!r)return;
  const cols=['Name','Email','Phone','LinkedIn / portfolio','CV link (7 days)','University','Major','Graduation year','City','Stage and preferences','Match %','Intern+ score','Band','Why matched','Missing skills','Status','Source'];
  const qq=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const lines=[cols.map(qq).join(',')];
  for(const c of Object.values(r.shortlist||{}))lines.push([c.name,c.email,c.phone,c.linkedin,state.cvUrls[c.cvPath]||'',c.university,c.major,c.gradYear,c.location,c.facts,c.match,c.score,c.band,c.why,(c.miss||[]).join('; '),c.status||'Shortlisted',c.source==='apply'?'Applied':c.source==='request'?'You requested':'Intern+ pick'].map(qq).join(','));
  const url=URL.createObjectURL(new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv'}));
  const a=document.createElement('a');a.href=url;a.download=`intern-plus-shortlist-${r.title.replace(/[^a-z0-9]+/gi,'-').toLowerCase()}.csv`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
}

/* ---------- BOOT ---------- */
draw();
if(sb){
  sb.auth.onAuthStateChange((event,session)=>{
    if(event==='PASSWORD_RECOVERY'){state.recovery=true;}
    if(event==='SIGNED_IN'||event==='SIGNED_OUT'||event==='INITIAL_SESSION'||event==='PASSWORD_RECOVERY'){
      if(event==='SIGNED_IN'&&state.session?.user?.id===session?.user?.id)return;
      setTimeout(()=>afterAuth(session),0);
    }
  });
}else{state.ready=true;draw();}
</script>
